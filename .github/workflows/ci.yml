name: ci

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]
  # release.yml runs these checks first, then releases (#285).
  workflow_call:

permissions:
  contents: read

# A newer push to the same pull request cancels the run still going. Runs on main are never cancelled. The event name
# keeps the checks that release.yml calls out of the group of a push to main.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # make test loads the release config and its changelog preset.
      - name: Install release tooling
        run: npm ci --no-fund --no-audit

      - name: Install Claude Code
        run: npm install -g --no-fund --no-audit @anthropic-ai/claude-code@2.1.308

      - name: make lint
        run: make lint

      - name: make test
        if: ${{ !cancelled() }}
        run: make test

  # Pull requests are squash-merged, so the title becomes the commit on main that semantic-release reads.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Title follows Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        # One rule (#276): a scope, a lower-case summary and the issue
        # it works on, as (#N) or (owner/repo#N). Dependabot (scope deps) and the release commit name no issue.
        run: |
          pattern='^(feat|fix|perf|revert|docs|style|refactor|test|build|ci|chore)\([a-z0-9-]+\)!?: [^A-Z].*\([^)]*#[0-9]+[^)]*\)'
          exempt='^[a-z]+\(deps\): |^chore\(release\): '
          if [[ ! "$TITLE" =~ $pattern && ! "$TITLE" =~ $exempt ]]; then
            echo "::error::PR title \"$TITLE\" must be 'type(scope): lower-case summary (#issue)', e.g. 'feat(testing): spock rule file (#123)'. See CONTRIBUTING.md#releases."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The squash commit carries the title, the description or the commit messages, depending on the repo's merge
      # setting. A skip-ci marker in any of them would skip the push to main, and with it the release.
      - name: No skip-ci marker that would reach main
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # Only the PR's own commits reach main in the squash; commits already on the base branch (such as a release
        # commit merged in from main) do not, so they are not checked.
        run: |
          marker='\[(skip ci|ci skip|no ci|skip actions|actions skip)\]|skip-checks: *true'
          if printf '%s\n%s\n' "$TITLE" "$BODY" | grep -qiE "$marker" || git log --format=%B "origin/$BASE_REF..$HEAD_SHA" | grep -qiE "$marker"; then
            echo "::error::The title, description or a commit message contains a skip-ci marker. The squash merge would carry it to main and skip the checks there. Reword it."
            exit 1
          fi
