name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Claude Code
        run: npm install -g --no-fund --no-audit @anthropic-ai/claude-code@2.1.308

      - name: make lint
        run: make lint

      - name: make test
        if: ${{ !cancelled() }}
        run: make test
