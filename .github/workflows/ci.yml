name: ci

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels the run still going. Runs on main are never cancelled, so a
# release is never cut off halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # make test loads the release config and its changelog preset.
      - name: Install release tooling
        run: npm ci --no-fund --no-audit

      - name: Install Claude Code
        run: npm install -g --no-fund --no-audit @anthropic-ai/claude-code@2.1.308

      - name: make lint
        run: make lint

      - name: make test
        if: ${{ !cancelled() }}
        run: make test

  # Pull requests are squash-merged, so the title becomes the commit on main that semantic-release reads.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Title follows Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        # One rule in chiyanram/skills, agent-factory and rca-agent (#276): a scope, a lower-case summary and the issue
        # it works on, as (#N) or (owner/repo#N). Dependabot (scope deps) and the release commit name no issue.
        run: |
          pattern='^(feat|fix|perf|revert|docs|style|refactor|test|build|ci|chore)\([a-z0-9-]+\)!?: [^A-Z].*\([^)]*#[0-9]+[^)]*\)'
          exempt='^[a-z]+\(deps\): |^chore\(release\): '
          if [[ ! "$TITLE" =~ $pattern && ! "$TITLE" =~ $exempt ]]; then
            echo "::error::PR title \"$TITLE\" must be 'type(scope): lower-case summary (#issue)', e.g. 'feat(testing): spock rule file (#123)'. See CONTRIBUTING.md#releases."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The squash commit carries the title, the description or the commit messages, depending on the repo's merge
      # setting. A skip-ci marker in any of them would skip the push to main, and with it the release.
      - name: No skip-ci marker that would reach main
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # Only the PR's own commits reach main in the squash; commits already on the base branch (such as a release
        # commit merged in from main) do not, so they are not checked.
        run: |
          marker='\[(skip ci|ci skip|no ci|skip actions|actions skip)\]|skip-checks: *true'
          if printf '%s\n%s\n' "$TITLE" "$BODY" | grep -qiE "$marker" || git log --format=%B "origin/$BASE_REF..$HEAD_SHA" | grep -qiE "$marker"; then
            echo "::error::The title, description or a commit message contains a skip-ci marker. The squash merge would carry it to main and skip the checks there. Reword it."
            exit 1
          fi

  # Runs only from "Run workflow" on main: during the dev phase a merge does not release (#276). A push to main runs
  # the check job alone.
  release:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write       # push the release commit and the <plugin>--v<version> tag
      issues: write         # comment "released in" on the issues a release closes
      pull-requests: write  # comment "released in" on the merged pull requests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # RELEASE_TOKEN is only needed when branch protection stops github.token from pushing to main.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # A plugin's first run has no <plugin>--v* tag yet. Tag the commit where its plugin.json got its current version,
      # so semantic-release counts from there instead of starting at 1.0.0. Every later run finds a tag and skips this.
      - name: Baseline tags
        run: |
          for plugin in $(python3 -c "import json; print(' '.join(p['name'] for p in json.load(open('.claude-plugin/marketplace.json'))['plugins']))"); do
            if [ -z "$(git tag --list "$plugin--v*")" ]; then
              manifest=plugins/$plugin/.claude-plugin/plugin.json
              version=$(python3 -c "import json; print(json.load(open('$manifest'))['version'])")
              commit=$(git log -1 --format=%H -G'"version"' -- "$manifest")
              git -c user.name=github-actions -c user.email=github-actions@github.com \
                tag -a "$plugin--v$version" "$commit" -m "$plugin $version"
              git push origin "$plugin--v$version"
            fi
          done

      - name: Install release tooling
        run: npm ci --no-fund --no-audit

      # One release line per plugin (ADR-0009).
      - name: semantic-release, once per plugin
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          for plugin in $(python3 -c "import json; print(' '.join(p['name'] for p in json.load(open('.claude-plugin/marketplace.json'))['plugins']))"); do
            RELEASE_PLUGIN=$plugin npx semantic-release
          done
