const DATA = [{"key": "fake", "name": "Fake model", "note": "Unit and IT tiers: the fake that stands in for the model. Every strong reference does all six; the Java ones are spring-ai, langchain4j and adk-java.", "items": [{"id": "LT1", "rec": "approve", "why": "Matches U3 (double only at a boundary) and research/24. spring-ai, openai-agents and adk-java each ship one shared scripted fake; claude-agent-sdk's copied per-test fakes drifted apart (two fake CLIs report different versions).", "rule": "Fake the model behind your own model port with one shared, scripted fake, because copied per-test mocks drift from the protocol and from each other.", "cites": "OA:src/agents/testing/model.py:249; ADKJ:core/src/test/java/com/google/adk/testing/TestLlm.java:47; contrast CA:tests/test_tool_callbacks.py:22, CA:tests/test_streaming_client.py:26", "file": "research/69-llm-testing-in-agent-sdks.md"}, {"id": "LT2", "rec": "approve", "why": "Cheap and catches a loop that runs one turn too many or too few. spring-ai, adk-java and openai-agents all throw when the script runs out; openai-agents also fails on unused steps.", "rule": "Make the scripted fake fail on an unscripted extra call and on unused steps, because a tolerant fake hides a loop that ran too many or too few turns.", "cites": "OA:\u2026/model.py:487-496,313-319; ADKJ:\u2026/TestLlm.java:197-207; SA:\u2026/ScriptedChatModel.java:73-76", "file": "research/69-llm-testing-in-agent-sdks.md"}, {"id": "LT3", "rec": "approve", "why": "In Spock or JUnit this is a global extension, or a test-profile bean, that fails any real model client unless the spec is tagged live. openai-agents and pydantic-ai both guard this way; claude-agent-sdk and adk-python have no guard.", "rule": "Fail any test that reaches a real model client unless it opts in by name, because an unguarded path spends money, runs slowly and flakes.", "cites": "OA:tests/conftest.py:129-141; PA:tests/conftest.py:107,580-582; PA:pydantic_ai_slim/pydantic_ai/models/__init__.py:2642-2643", "file": "research/69-llm-testing-in-agent-sdks.md"}, {"id": "LT4", "rec": "approve", "why": "The main place loop bugs show: a lost tool result or broken history appears in the next request, not in the final answer. It is the positive form of V3 (no mock that implements the asserted behaviour).", "rule": "Assert on the request the code sent the model, not only on the final answer, because lost tool results and broken history show up only in the next call's input.", "cites": "SA:\u2026/SessionMemoryAdvisorToolLoopTests.java:49-60; OA:tests/test_agent_runner.py:2024-2037; LG:libs/prebuilt/tests/model.py:36; MA:\u2026/aimock/README.md:15-19", "file": "research/69-llm-testing-in-agent-sdks.md"}, {"id": "LT5", "rec": "approve", "why": "Needed wherever adapters are hand-written over raw HTTP: a model-port fake never runs the request mapping. langchain4j (MockHttpClient), adk-java (FakeGeminiApi) and anthropic-sdk-java all do it.", "rule": "Test each provider adapter against a fake HTTP transport under the real SDK and assert the request JSON, because a model-level fake skips the request mapping that breaks in production.", "cites": "L4J:\u2026/MockHttpClient.java:28-30; ADKJ:core/src/test/java/com/google/adk/models/FakeGeminiApi.java:52,59; AJ:\u2026/FakeHttpClient.kt:18-25", "file": "research/69-llm-testing-in-agent-sdks.md"}, {"id": "LT6", "rec": "change", "why": "Approve the rule, but merge it with LS12 when the reference is written: the same abstract contract suite runs at the IT tier against a fake HTTP server and at the live tier against the real provider (langchain4j: 33 methods, 43 provider classes).", "rule": "Make every model adapter pass one shared contract suite, with each unsupported capability declared and tested to throw, because an unchecked opt-out silently drops a parameter.", "cites": "L4J:\u2026/AbstractBaseChatModelIT.java:679,1269-1286,1840; LG:libs/checkpoint-conformance/README.md:19", "file": "research/69-llm-testing-in-agent-sdks.md"}]}, {"key": "loop", "name": "Agent loop", "note": "How the loop itself is tested on the fake: errors, caps, streaming, retries, time.", "items": [{"id": "LT7", "rec": "approve", "why": "Every strong reference asserts the error reaches the model and the run continues (anthropic-sdk-java, langchain4j, pydantic-ai, adk-python).", "rule": "Feed tool and validation errors back to the model in tests and assert the run continues, because a swallowed error stalls the loop or yields a confident wrong answer.", "cites": "AJ:\u2026/BetaToolRunnerTest.kt:142-197,1189-1211; PA:tests/test_agent.py:342-420; ADKP:tests/unittests/flows/llm_flows/tools/test_functions_error_messages.py:103-128", "file": "research/69-llm-testing-in-agent-sdks.md"}, {"id": "LT8", "rec": "approve", "why": "anthropic-sdk-java, adk-java and pydantic-ai test the cap; spring-ai's live IT has an unbounded while-loop, which is the failure this prevents.", "rule": "Cap the agent loop by turns or requests and test the cap, because an unbounded tool loop turns one model misstep into a hung, billed run.", "cites": "AJ:\u2026/BetaToolRunnerTest.kt:74; ADKJ:\u2026/BaseLlmFlowTest.java:230-256; PA:tests/test_usage_limits.py:74-86; contrast SA:\u2026/AnthropicChatModelIT.java:321-325", "file": "research/69-llm-testing-in-agent-sdks.md"}, {"id": "LT9", "rec": "approve", "why": "spring-ai's scripted fake streams one chunk only, so its streaming tests never cross a chunk boundary; langchain4j joins partials and tool-call deltas and checks order.", "rule": "In streaming tests, script several chunks, assert they join to the final message and arrive in order, and bound every wait, because streams lose, reorder or hang.", "cites": "L4J:\u2026/AbstractBaseChatModelIT.java:193,727-757; L4J:\u2026/AbstractStreamingChatModelIT.java:215; contrast SA:\u2026/ScriptedChatModel.java:80-84", "file": "research/69-llm-testing-in-agent-sdks.md"}, {"id": "LT10", "rec": "approve", "why": "mastra's mid-stream-drop scenario guards a real regression: the partial attempt was merged into the stored message.", "rule": "After an injected provider failure, assert the persisted conversation and side effects, not just the reply, because a retry can store a partial reply or run a tool twice.", "cites": "MA:\u2026/api-error-retry-rollback.scenario.test.ts:24,47-51,87-89; MA:\u2026/approval-suspend-paths.scenario.test.ts:138-143", "file": "research/69-llm-testing-in-agent-sdks.md"}, {"id": "LT11", "rec": "change", "why": "The fixed-clock half is already U1 (repeatable: fixed clock). Keep only the new half: order races with explicit signals, never sleeps (openai-agents' guardrail race test).", "rule": "Control time with a fixed clock and order races with explicit signals, never sleeps, because timing-based tests stop exercising the regression and still pass.", "cites": "AJ:\u2026/RetryingHttpClientTest.kt:195-227; LG:libs/langgraph/tests/test_retry.py:290-304; OA:tests/test_stream_input_guardrail_timing.py:185-260", "file": "research/69-llm-testing-in-agent-sdks.md"}]}, {"key": "scenarios", "name": "Agent scenarios", "note": "One rule per agent scenario, each from the best fake-tier test found (research/70 section 2).", "items": [{"id": "LS1", "rec": "approve", "why": "langchain4j evicts a tool call and its result together; spring-ai snaps to a turn boundary and keeps the system prompt.", "rule": "Test the memory window with the real class, asserting the exact window after each message, because evicting a tool call without its result makes the provider reject the next request.", "cites": "L4J:langchain4j/src/test/java/dev/langchain4j/memory/chat/MessageWindowChatMemoryTest.java:167,204; SA:spring-ai-model/\u2026/MessageWindowChatMemoryTests.java:208,263", "file": "research/70-agent-scenario-tests.md"}, {"id": "LS2", "rec": "approve", "why": "spring-ai pins what is kept and what the summariser saw; adk-java pins that already-compacted history is never summarised again.", "rule": "Test compaction with a recording fake summariser: assert what is kept, what the summariser saw, and that a second pass never summarises again, because repeated compaction rewrites history every turn.", "cites": "SA:spring-ai-session/\u2026/ChatModelSummarizerTests.java:218; ADKJ:core/src/test/java/com/google/adk/summarizer/SlidingWindowEventCompactorTest.java:81,95", "file": "research/70-agent-scenario-tests.md"}, {"id": "LS3", "rec": "approve", "why": "The strongest test found: pydantic-ai checks byte-stable prefixes over every capability and three providers, with a moving fake clock.", "rule": "Assert each request starts with the previous request's bytes while a fake clock moves, because a timestamp or rewritten history silently busts the prompt cache.", "cites": "PA:tests/test_history_append_only.py:459; PA:tests/append_only.py:1247", "file": "research/70-agent-scenario-tests.md"}, {"id": "LS4", "rec": "approve", "why": "spring-ai caps Anthropic's 4 cache breakpoints and marks only the last tool result.", "rule": "Assert cache markers sit only where the provider allows and no more than its limit, because extra breakpoints waste the cache or fail the request.", "cites": "SA:models/spring-ai-anthropic/\u2026/AnthropicChatModelTests.java:1042; SA:\u2026/CacheEligibilityResolverTests.java:210", "file": "research/70-agent-scenario-tests.md"}, {"id": "LS5", "rec": "approve", "why": "mastra keys on tenant and never caches errors; spring-ai includes the system prompt so personas don't share answers.", "rule": "Key a response cache on tenant, system prompt and inputs, and never cache an error, because a key on user text alone serves one persona's answer to another.", "cites": "MA:\u2026/agent-response-cache.test.ts:140,164,306; SA:\u2026/SemanticCacheAdvisorTests.java:184", "file": "research/70-agent-scenario-tests.md"}, {"id": "LS6", "rec": "approve", "why": "pydantic-ai keeps the response that crossed the limit, because it was already billed.", "rule": "When a run crosses a usage or spend limit, keep the response that crossed it and count it, because dropping it under-counts spend and re-requesting it bills twice.", "cites": "PA:tests/test_usage_limits.py:1216; PA:tests/harness/spend/test_spend.py:538,627", "file": "research/70-agent-scenario-tests.md"}, {"id": "LS7", "rec": "approve", "why": "openai-agents asserts the blocked run made zero model calls, and that a rejected tool input never runs the tool.", "rule": "Test that a blocking guard stops the run before the model or tool is called, with the rejection text as the tool result, because a late guard lets side effects through.", "cites": "OA:tests/test_guardrails.py:423; OA:tests/test_agent_runner.py:2331", "file": "research/70-agent-scenario-tests.md"}, {"id": "LS8", "rec": "approve", "why": "openai-agents and adk-java resume from saved state and assert each side effect ran exactly once, including adversarial cases.", "rule": "Test approval by serialising the paused run, restoring it, then approving or rejecting, asserting each side effect ran exactly once, because resume re-runs completed tools.", "cites": "OA:tests/test_resume_tool_use_behavior.py:15; ADKJ:\u2026/RequestConfirmationLlmRequestProcessorTest.java:142,162", "file": "research/70-agent-scenario-tests.md"}, {"id": "LS9", "rec": "approve", "why": "pydantic-ai names and prices the serving model. No Java reference tests fallback at all, so this fills a real gap.", "rule": "Test fallback by failing the primary fake, then assert the serving model's name, the recorded failed attempt and the price on the serving model, because cost reports book the wrong model.", "cites": "PA:tests/models/test_fallback.py:186,1992,228", "file": "research/70-agent-scenario-tests.md"}, {"id": "LS10", "rec": "change", "why": "No reference tests this, so it has no source: approve it only as an ours-rule, marked as such in the ledger, or leave it in Fog until we have a failure that shows it.", "rule": "Test prompt injection arriving in a tool result through a whole run, because every reference guards user input only, and tool results are where untrusted text enters.", "cites": "gap: OA:tests/test_tool_guardrails.py:351 is the closest, called directly", "file": "research/70-agent-scenario-tests.md"}]}, {"key": "recordings", "name": "Recordings", "note": "Only applies to a project that replays recorded provider traffic. The JVM references hand-write payloads instead; these rules say how to do replay safely if a project chooses it.", "items": [{"id": "LT12", "rec": "approve", "why": "pydantic-ai fails on unplayed interactions; mastra accepts a 60% fuzzy match with only a warning, the failure this prevents.", "rule": "If you replay recorded traffic, fail on unplayed or unmatched interactions and never accept near-matches, because a stale recording keeps passing after the code stops sending a field.", "cites": "PA:tests/conftest.py:847-875; PA:tests/AGENTS.md:15,159,163; contrast MA:packages/_llm-recorder/src/llm-recorder.ts:608,1019-1044", "file": "research/69-llm-testing-in-agent-sdks.md"}, {"id": "LT13", "rec": "approve", "why": "pydantic-ai scrubs credentials, tokens and account ids in pre-record hooks; mastra stores request bodies unscrubbed.", "rule": "Scrub credentials, account ids and vendor headers in a pre-record hook, and pin load-bearing facts in the test body, because recordings are committed forever and nobody reviews them.", "cites": "PA:tests/cassette_hooks.py:63-77,132-143,237-238; PA:tests/AGENTS.md:268; contrast MA:\u2026/llm-recorder.ts:142-146", "file": "research/69-llm-testing-in-agent-sdks.md"}]}, {"key": "live", "name": "Live tests", "note": "Tests that call a real provider. Several rules overlap; the recommendations merge them so the reference keeps one rule per idea. The schedule (every PR first) is a project choice and lives in the project's docs/agents/testing.md.", "items": [{"id": "LS11", "rec": "approve", "why": "The core rule of the tier: all ten references fake agent behaviour and go live only for acceptance, decisions, real chunking, and real usage and errors.", "rule": "Live-test only what a fake cannot know \u2014 provider acceptance, real decisions, real chunking, real usage and errors \u2014 and keep the agent's own logic in fakes, because live tests cost money every run.", "cites": "\u00a73; \u00a74", "file": "research/70-agent-scenario-tests.md"}, {"id": "LS12", "rec": "change", "why": "Merge with LT6 into one rule: one contract suite, run against a fake HTTP server in IT and against the real provider live.", "rule": "Write each live check once as a contract suite every provider adapter runs, with unsupported features declared and tested to fail, because per-provider copies drift.", "cites": "L4J:L4J-C/AbstractBaseChatModelIT.java:1269-1286; SA:SA-T/AbstractToolCallingAdvisorIT.java:275", "file": "research/70-agent-scenario-tests.md"}, {"id": "LS13", "rec": "approve", "why": "langchain4j asserts maxOutputTokens(5) gives exactly 5 tokens and finish reason LENGTH; acceptance alone hides a dropped field.", "rule": "In a live test, assert a parameter's effect, not only acceptance (five output tokens give LENGTH; a stop sequence cuts text), because a dropped field is accepted silently.", "cites": "L4J:L4J-C/AbstractBaseChatModelIT.java:396,527,1951", "file": "research/70-agent-scenario-tests.md"}, {"id": "LS14", "rec": "change", "why": "Merge into LT15 as its tool-call example (exact arguments plus a stub-tool marker).", "rule": "Live-test tool calls on exact argument JSON and a marker the stub tool returns, because that proves the model called the tool and our result reached it.", "cites": "L4J:L4J-C/AbstractBaseChatModelIT.java:706,786; SA:SA-A/AnthropicChatModelIT.java:326", "file": "research/70-agent-scenario-tests.md"}, {"id": "LS15", "rec": "approve", "why": "Real chunking is the most live-tested behaviour after basic chat: about 96 spring-ai classes and every langchain4j streaming provider.", "rule": "Live-test streaming by joining partials and tool-call deltas to the final message, because real chunking differs from every fixture.", "cites": "L4J:L4J-C/AbstractBaseChatModelIT.java:724-726,1097-1100; SA:SA-O/chat/OpenAiChatModelIT.java:344", "file": "research/70-agent-scenario-tests.md"}, {"id": "LS16", "rec": "approve", "why": "Only the provider reports cache-write and cache-read tokens; spring-ai, langchain4j and pydantic-ai all assert them.", "rule": "Live-test cache and usage numbers, and the price computed from them, because only the provider reports cache-write and cache-read tokens.", "cites": "SA:SA-A/AnthropicPromptCachingIT.java:214; L4J:\u2026/BedrockPromptCachingIT.java:383; PA:tests/models/test_anthropic.py:15157", "file": "research/70-agent-scenario-tests.md"}, {"id": "LS17", "rec": "change", "why": "Merge into LT15 as its agent-level example (a bank balance, a routed sub-agent).", "rule": "Check agent-level live tests on the state the run changed \u2014 a balance, a row, the routed agent \u2014 never on wording, because wording varies by model and run.", "cites": "L4J:langchain4j-agentic/\u2026/SupervisorAgentIT.java:312; ADKJ:contrib/langchain4j/\u2026/LangChain4jIntegrationTest.java:306", "file": "research/70-agent-scenario-tests.md"}, {"id": "LT14", "rec": "change", "why": "Keep everything except 'scheduled': a separate job with a pinned small model, a token cap and a protected secret, failing when skipped. Whether it runs per PR or nightly is the project's choice. Also absorb LS18.", "rule": "Run real-model tests in their own scheduled job with a pinned small model, a token cap and a protected secret, failing when skipped, because skipped-everywhere tests rot unnoticed.", "cites": "PA:.github/workflows/gateway-model-health.yml:4-7,19-26; CA:e2e-tests/conftest.py:7-28; SA:.github/workflows/spring-ai-integration-tests.yml:4-28,111-117; OA:integration_tests/README.md:29", "file": "research/69-llm-testing-in-agent-sdks.md"}, {"id": "LS18", "rec": "change", "why": "Merge into LT14: pinning the model and e2e.test.ts:20,47; CA:e2e-tests/test_dynamic_control.py:44,79", "file": "research/70-agent-scenario-tests.md"}, {"id": "LS20", "rec": "approve", "why": "pydantic-ai's weekly model-catalogue check, with excluded names as strict expected failures; cheap and catches retired models.", "rule": "Check each configured model name against the provider, and mark known-excluded names as expected failures that must fail, because providers retire models and a fix should be noticed.", "cites": "PA:tests/providers/test_gateway_catalog.py:80-84; PA:.github/workflows/gateway-model-health.yml:6", "file": "research/70-agent-scenario-tests.md"}]}, {"key": "evals", "name": "Evals", "note": "Scored quality checks over repeated runs. A separate tier from live tests; none of the ten references blocks CI on an eval.", "items": [{"id": "LT17", "rec": "approve", "why": "mastra's judge gives verdicts and code does the arithmetic; langchain4j counts NOT_SURE as failing; spring-ai's IT lets the generator grade itself, the failure this prevents.", "rule": "Have an LLM judge give atomic verdicts, count \"not sure\" as failing, compute the score in tested code, and never grade with the generating model, because judge arithmetic and self-grading inflate scores.", "cites": "MA:\u2026/hallucination/index.ts:44-101; MA:\u2026/denominator.test.ts:7-46; L4J:\u2026/JudgeVerdict.java:60-65; SA:\u2026/RelevancyEvaluatorTests.java:81-107; contrast SA:\u2026/QuestionAnswerAdvisorIT.java:187-189", "file": "research/69-llm-testing-in-agent-sdks.md"}, {"id": "LT18", "rec": "approve", "why": "adk-python versions thresholds per metric and aggregates by pass rate or minimum over runs; mastra fails a non-finite score.", "rule": "Gate an eval on versioned per-metric thresholds over repeated runs, with an explicit pass-rate or minimum rule, because one lucky or unlucky sample decides otherwise.", "cites": "ADKP:src/google/adk/evaluation/eval_config.py:469-486,549-551; MA:packages/core/src/evals/thresholds.ts:16-26; MA:packages/evals/src/vitest/expect-evals.ts:41-52", "file": "research/69-llm-testing-in-agent-sdks.md"}]}];
const KEY = "llm-testing-review-v1";
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { state = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
let current = DATA.length ? DATA[0].key : null;
try { const h = location.hash.slice(1); if (DATA.some(g => g.key === h)) current = h; } catch (e) {}
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const decided = g => g.items.filter(it => (state[g.key + ":" + it.id] || {}).v).length;
const label = v => v === "change" ? "Change…" : v[0].toUpperCase() + v.slice(1);

function renderTabs() {
  const t = document.getElementById("tabs");
  t.innerHTML = DATA.map(g => {
    const n = decided(g), all = n === g.items.length;
    return `<button class="tab" role="tab" aria-selected="${g.key === current}" data-k="${g.key}">${esc(g.name)} · ${all ? `<span class="done">done</span>` : `${n}/${g.items.length}`}</button>`;
  }).join("");
  t.querySelectorAll(".tab").forEach(b => b.onclick = () => { current = b.dataset.k; try { history.replaceState(null, "", "#" + current); } catch (e) {} render(); });
}
function render() {
  renderTabs();
  const g = DATA.find(x => x.key === current);
  const list = document.getElementById("list");
  document.getElementById("gnote").textContent = g ? g.note : "";
  if (!g) { list.innerHTML = "<p>No groups loaded yet.</p>"; return; }
  list.innerHTML = g.items.map(it => {
    const d = state[g.key + ":" + it.id] || {};
    return `<article class="rule" data-id="${esc(it.id)}">
      <div class="rule-head"><span class="rid">${esc(it.id)}</span><span class="rtext">${esc(it.rule)}</span></div>
      <div class="cites">${esc(it.cites)} · ${esc(it.file)}</div>
      <section class="rec"><h3>Recommendation <span class="chip ${esc(it.rec)}">${label(it.rec).replace("…", "")}</span></h3><p>${esc(it.why)}</p></section>
      <div class="decide">
        ${["approve", "reject", "change"].map(v => `<button data-v="${v}" aria-pressed="${d.v === v}">${label(v)}</button>`).join("")}
        <textarea id="note-${esc(g.key)}-${esc(it.id)}" placeholder="What should change?" ${d.v === "change" ? "" : "hidden"}>${esc(d.note || "")}</textarea>
      </div></article>`;
  }).join("");
  list.querySelectorAll(".rule").forEach(a => {
    const id = a.dataset.id, k = g.key + ":" + id;
    a.querySelectorAll(".decide button").forEach(b => b.onclick = () => {
      state[k] = { ...(state[k] || {}), v: b.dataset.v }; save(); render();
    });
    const ta = a.querySelector("textarea");
    ta.oninput = () => { state[k] = { ...(state[k] || {}), v: "change", note: ta.value }; save(); summary(); };
  });
  summary();
}
function decisionText(g) {
  const pick = v => g.items.filter(it => (state[g.key + ":" + it.id] || {}).v === v);
  const ap = pick("approve").map(i => i.id), rj = pick("reject").map(i => i.id), ch = pick("change");
  const open = g.items.filter(it => !(state[g.key + ":" + it.id] || {}).v).map(i => i.id);
  const parts = [];
  if (ap.length === g.items.length) parts.push("approve all");
  else {
    if (ap.length) parts.push("approve " + ap.join(", "));
    if (rj.length) parts.push("reject " + rj.join(", "));
    ch.forEach(i => parts.push(`change ${i.id}: ${((state[g.key + ":" + i.id] || {}).note || "").trim() || "(no note)"}`));
    if (open.length) parts.push("undecided " + open.join(", "));
  }
  return `G34 ${g.name}: ` + parts.join("; ");
}
function summary() {
  const g = DATA.find(x => x.key === current); if (!g) return;
  const n = v => g.items.filter(it => (state[g.key + ":" + it.id] || {}).v === v).length;
  document.getElementById("count").textContent = `${g.name}: ${n("approve")} approved · ${n("reject")} rejected · ${n("change")} to change · ${g.items.length - n("approve") - n("reject") - n("change")} undecided`;
}
document.getElementById("all").onclick = () => {
  const g = DATA.find(x => x.key === current); if (!g) return;
  g.items.forEach(it => {
    const k = g.key + ":" + it.id;
    if (!(state[k] || {}).v) state[k] = it.rec === "change" ? { v: "change", note: "as recommended: " + it.why } : { v: it.rec };
  });
  save(); render();
};
document.getElementById("copy").onclick = () => {
  const g = DATA.find(x => x.key === current); if (!g) return;
  const t = decisionText(g), out = document.getElementById("out");
  out.textContent = t;
  const done = () => { out.textContent = "Copied. Paste it into the chat:\n" + t; };
  try { navigator.clipboard.writeText(t).then(done, () => { out.textContent = "Select and copy this line:\n" + t; }); }
  catch (e) { out.textContent = "Select and copy this line:\n" + t; }
};
render();
</script>
