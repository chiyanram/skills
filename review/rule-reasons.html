ion placement = ours (audit 2026-10-04) \u00b7 was: plinth corpus :233, :336 (gap matrix); pinned 130:238-239 CATEGORIZE; CLAUDE.md MR rule", "rw": 27, "ow": 10}, {"line": 17, "id": "B1", "reason": "because with only one item a correct and an inverted offset both pass", "kind": "evidence", "cite": "research/31a-v2.md:501; research/21-mutation-and-property.md:36", "basis": "Cardinality 1 only: offset is always zero; #505 had 7 survivors killed only by a second entity.", "ref": "testing/references/boundaries.md", "rule": "For each input a piece of logic accepts, check the CORRECT boundaries: Conformance \u00b7 Ordering \u00b7 Range \u00b7 Reference \u00b7 Existence (null/empty/missing) \u00b7 Cardinality (0, 1, many) \u00b7 Time (order, timeouts, clock).", "source": "plinth 130:21 (pinned) + example 130:164-235; Good RotationReminderBoundarySpec:42-71", "rw": 32, "ow": 13}, {"line": 18, "id": "B2", "reason": "because 'consider boundaries' let -1, 1 and null inputs go untested past review", "kind": "evidence", "cite": "research/15-testing-content-audit.md:129,390", "basis": "P1 F7 on !230: eval(-1), Pinned(1), null toolIds untried; a vague prompt to consider boundaries failed.", "ref": "testing/references/boundaries.md (trigger)", "rule": "Run CORRECT whenever the change adds/changes logic taking a number, collection, string format, enum/sealed set, time value, or optional/nullable input; the test file has \u22651 case per applicable letter or a \"skip: <letter> \u2014 <reason>\" line.", "source": "SRC1 (2026-10-03): plinth 130 SKILL.md:17 / plinth-pinned 130:167 (CORRECT) \u2713 partial \u00b7 trigger list, \u22651 case per letter, skip line = PROJECT DECISION (operator, G9a) \u00b7 evidence: ours: R13 M5; P1 F7 (!230: eval(-1), Pinned(1), null toolIds untried)", "rw": 36, "ow": 13}, {"line": 19, "id": "B3", "reason": "because testing only one side of an edge lets an off-by-one comparison pass", "kind": "evidence", "cite": "research/31a-v2.md:562", "basis": "ForwardContextParserTest tests 4097 only; 4096 never shown to pass, so an off-by-one >= passes.", "ref": "testing/references/boundaries.md (Range)", "rule": "For a Range boundary, test just inside and just outside the edge, not only the edge (1..10 \u2192 0, 1, 10, 11).", "source": "plinth corpus 130-\u2026-correct.md:94 (audit 2026-10-04) \u00b7 was: plinth corpus :219; P1 F7 (Pinned(1), eval(-1))", "rw": 22, "ow": 13}, {"line": 20, "id": "V1", "reason": "because a test with no credible regression costs upkeep and protects nothing", "kind": "evidence", "cite": "refs/openclaw-openclaw/.agents/skills/test-audit/SKILL.md:21-22,70-71; research/31a-v2.md:586", "basis": "Tests justify maintenance cost by a credible regression; AlertTriggerTypeSpec protects no behaviour, compile fails first.", "ref": "testing/references/value-bar.md", "rule": "Before adding a test answer 4 questions (one line each; missing answer = do not add): 1 which behaviour/contract it protects; 2 what realistic regression makes it fail; 3 why existing coverage does not catch it (one primary test per contract at its strongest boundary); 4 does it need a production seam no real caller needs \u2192 test at the real boundary instead.", "source": "openclaw test-audit/SKILL.md:18-29; Bad AlertTriggerTypeSpec:8-13", "rw": 63, "ow": 12}, {"line": 21, "id": "V2", "reason": "because it fails on a safe rename while the real output stays the same", "kind": "evidence", "cite": "research/31a-v2.md:621; refs/openclaw-openclaw/.agents/skills/test-audit/SKILL.md:33-35", "basis": "RefusalReasonSpec pins enum member names: a rename breaks it while every emitted string is unchanged.", "ref": "testing/references/value-bar.md", "rule": "A test that would break under a behaviour-preserving refactor asserts implementation; rewrite it at the boundary that owns the behaviour before it lands.", "source": "openclaw test-audit/SKILL.md:34-35; Bad RefusalReasonSpec:44-51, Good RefusalReasonSpec:19-26,74-90", "rw": 23, "ow": 14}, {"line": 22, "id": "V3", "reason": "because a junk-pattern test cannot fail for a real defect", "kind": "stated", "cite": "refs/cursor-plugins/\u2026/principle-test-behavior-not-implementation/SKILL.md:13", "basis": "A test that cannot fail for a defect costs CI time and review attention and catches nothing.", "ref": "testing/references/value-bar.md", "rule": "A new test matching a junk pattern fails the gate unless it names the contract it independently guards: 1 no assertion \u00b7 2 self/copy comparison \u00b7 3 hand-copied list of enum/registry members \u00b7 4 greps source/exact strings instead of running code \u00b7 5 expected value produced by code under test \u00b7 6 mock implements the asserted behaviour \u00b7 7 same contract twice at different layers with no new risk \u00b7 8 name promises more than the input exercises.", "source": "openclaw test-audit/SKILL.md:43-66 (8 of 15 kept); Bad AlertTriggerTypeSpec:8-13, RunModeSpec (!230 F5), RunModeSpec:49-60", "rw": 78, "ow": 10}, {"line": 23, "id": "V4", "reason": "because copies at mocked layers cannot see the bug and only add upkeep", "kind": "evidence", "cite": "research/31a-v2.md:679; refs/openclaw-openclaw/.agents/skills/test-audit/SKILL.md:39-40", "basis": "Adapted #521 replay: mocked layers cannot see Redis collapse two names; they add cost, not protection.", "ref": "testing/references/value-bar.md", "rule": "A bug gets ONE regression test, at the boundary that owns the behaviour; do not replay the scenario at every layer it crosses.", "source": "openclaw test-audit/SKILL.md:39-40 (audit 2026-10-04) \u00b7 was: openclaw test-audit/SKILL.md:38-41; complements S4", "rw": 23, "ow": 13}, {"line": 24, "id": "V5", "reason": "because a test that looks like junk may be the only guard of a contract", "kind": "stated", "cite": "refs/openclaw-openclaw/.agents/skills/test-audit/SKILL.md:105-109", "basis": "A resembling-implementation test may still be the independent contract; a baseline failure may be a product bug.", "ref": "testing/references/value-bar.md (retention bar)", "rule": "Keep an existing test if it independently guards a contract (API, protocol, config, migration, storage, security, a promised default, architecture), if order is observable behaviour, if it is a regression with a realistic failure mode, or if it fails on master (treat as a possible product bug: reproduce, fix the owner, never delete). Slow or static is not a deletion reason; prove a test is junk before removing it.", "source": "openclaw test-audit \u00a7 Retention bar; ours test-value-bar.md:82", "rw": 69, "ow": 15}, {"line": 25, "id": "U1", "reason": "because a test tied to clock, order or shared state fails without a defect", "kind": "stated", "cite": "plinth 130 a-trip.md:103; research/31b-v2.md:47", "basis": "Repeatable tests fail because behaviour changed, not the environment; UiModelSwapE2EIT sleep-poll depends on host speed.", "ref": "testing/references/unit-tests.md", "rule": "Every test is A-TRIP: Automatic \u00b7 Thorough (the cases C1/B1 call for) \u00b7 Repeatable (fixed clock, no shared state, no order dependence) \u00b7 Independent (runs alone, any order) \u00b7 Professional (named and kept like production code).", "source": "plinth 130:20 (pinned); Good RotationReminderBoundarySpec:42-71, Bad UiModelSwapE2EIT:604", "rw": 36, "ow": 14}, {"line": 27, "id": "U3", "reason": "because mocking your own classes breaks tests on refactors that keep behaviour", "kind": "stated", "cite": "refs/mattpocock-skills/skills/engineering/tdd/SKILL.md:30; tdd/mocking.md:3-14", "basis": "Implementation-coupled tests mock internal collaborators; the tell is breaking on refactor when behaviour is unchanged.", "ref": "testing/references/unit-tests.md", "rule": "Double only at a boundary (outbound port, clock, randomness, external API), never your own classes. Stub() when the collaborator only returns something; Mock() only when the call itself is the behaviour, asserting only that interaction. Prefer an existing fake port over either.", "source": "spock-best-practices SKILL.md:81-82; mattpocock tdd mocking.md:3-12; CLAUDE.md fake ports; Good AgentEvalServiceSpec:221-226; R13 M2", "rw": 42, "ow": 12}, {"line": 28, "id": "U4", "reason": "because a direct Instant.now() call cannot be stubbed and makes tests flaky", "kind": "stated", "cite": "refs/plinth-pinned/321-\u2026-unit-tests.md:196-200", "basis": "Bad example: static time cannot be stubbed; tests become flaky or need brittle approximate-now assertions.", "ref": "code/references (home) \u00b7 pointed at from testing/references/unit-tests.md", "rule": "Production code never calls Instant.now()/LocalDate.now()/UUID.randomUUID() directly in logic a test must pin; it takes an injected Clock (and Supplier<UUID> where an id matters); tests use Clock.fixed(...).", "source": "plinth 321:132-136; Good RotationReminderBoundarySpec:42-71", "rw": 26, "ow": 12}, {"line": 29, "id": "IT1", "reason": "because ITs that re-run unit-owned branches add slow copies with no new risk", "kind": "evidence", "cite": "research/31b-v2.md:175; refs/plinth-pinned/322-\u2026-integration-tests.md:58,104-105", "basis": "Four HTTP ITs re-test missing-field branches the unit test already owns; plinth: IT should assume the logic correct.", "ref": "testing/references/integration-tests.md", "rule": "An IT proves wiring and contracts (HTTP boundary, SQL on real Postgres, Redis streams, Spring wiring, lifecycle); it does not re-test business branches a unit spec owns. One IT per contract.", "source": "plinth 322:57 (pinned); openclaw test-audit:23-27; Good ConsumerIdentityIT:31-67", "rw": 31, "ow": 13}, {"line": 30, "id": "IT2", "reason": "because a cached context can outlive a per-class container that has stopped", "kind": "stated", "cite": "research/26-spring-testing-docs.md:21", "basis": "Spring Boot testcontainers docs confirm the @Container hazard: a cached context may outlive a stopped container.", "ref": "testing/references/integration-tests.md", "rule": "ITs get containers only from the singleton initializer (@EnableAruviiIT JUnit / @EnableAruviiSpec Spock); never @Testcontainers/@Container or @ServiceConnection. Decided edge: plinth 322 default rejected (container stops per class; @ServiceConnection covers 5 of 14 properties).", "source": "AruviiTestcontainersInitializer.java:15-29 (master); R15 X4; R13", "rw": 33, "ow": 12}, {"line": 31, "id": "IT3", "reason": "because MockMvc skips the real servlet stack, filters and error pages", "kind": "stated", "cite": "research/26-spring-testing-docs.md:22; research/31b-v2.md:240", "basis": "Boot docs: mock environment cannot test lower-level servlet concerns; standalone MockMvc had no filter chain or security.", "ref": "testing/references/integration-tests.md", "rule": "ITs call the HTTP API with RestTestClient against the real server (RANDOM_PORT); never MockMvc, MockMvcTester or TestRestTemplate. Decided edge: plinth 322 alternatives rejected.", "source": "SRC1 audit (2026-10-04): PROJECT DECISION (operator 2026-10-04) \u2014 overrides plinth 322:171 (TestRestTemplate), 322:520-523 (MockMvcTester) \u00b7 was: CLAUDE.md; it-testing skill; R15; R13 (testing.md \u00a78 recommends MockMvc \u2014 removed)", "rw": 23, "ow": 11}, {"line": 32, "id": "IT4", "reason": "because a mock has no behaviour of its own and couples the IT to calls", "kind": "stated", "cite": "research/24-fakes-vs-mocks.md:31; research/31b-v2.md:273", "basis": "Fowler: mockist tests are more coupled to implementation; a Mockito double has no behaviour of its own.", "ref": "testing/references/integration-tests.md", "rule": "In an IT swap a collaborator only at an outbound port with a fake port bean (real in-memory implementation); never @MockitoBean. New ITs comply at once.", "source": "SRC1 (2026-10-03): mattpocock codebase-design/DEEPENING.md:19 ('in-memory adapter'); addy test-driven-development/SKILL.md:310 (real > fakes > mocks) \u2713 partial \u00b7 'never @MockitoBean' = PROJECT DECISION (operator 2026-10-03: overrides plinth 301:1345 and the commented-out plinth 322:71; Decided edge in integration-tests.md) \u00b7 evidence: CLAUDE.md; hook warn-mockitobean-in-it.sh", "rw": 26, "ow": 15}, {"line": 33, "id": "AT1", "reason": "because a .feature tier with no Gherkin runtime left an orphan copy of an IT", "kind": "evidence", "cite": "research/31a-v2.md:387; research/18-plinth-testing-mapping.md:15", "basis": "ToolOutputSplitHarness serves a .feature not on master; orphan adapter duplicating ToolOutputSplitIT; no Gherkin runtime.", "ref": "testing (tiers)", "rule": "No separate acceptance tier: an AC is proven by an IT (API, RestTestClient) or a smoke/e2e spec (UI), chosen by scenario-to-tests; plinth 133/323 .feature + RestAssured rejected.", "source": "SRC1 audit (2026-10-04): PROJECT DECISION (operator 2026-10-04) \u2014 overrides plinth 133 / 323:21 (*AT from .feature files) \u00b7 was: plinth 133/323; IT3; G9a default (happy + failure)", "rw": 27, "ow": 15}, {"line": 35, "id": "TM1", "reason": "because a unit spec through a mock cannot see what the real boundary does", "kind": "evidence", "cite": "research/31a-v2.md:187,201", "basis": "Filtering lives in SQL; FeedbackServiceSpec re-proves via a mock what the Postgres IT proves on real rows.", "ref": "testing/references/strategy.md", "rule": "Where behaviour crosses a boundary the IT is the primary test; unit specs there cover only branching the IT cannot reach cheaply (many input combinations, error mapping, edge values); no unit test re-proves what the IT proves.", "source": "R19: openai-agents docs/testing.md:524; Kent C. Dodds write-tests; Fowler 2021 test shapes; fits S1, IT1, V1", "rw": 37, "ow": 14}, {"line": 36, "id": "TM2", "reason": "because a fake of our own code leaves its real query untested", "kind": "evidence", "cite": "research/31a-v2.md:242; research/24-fakes-vs-mocks.md:38", "basis": "FakeActiveSessionCountPort fakes our DB-backed port in an IT; the session-count query is never exercised.", "ref": "testing/references/strategy.md", "rule": "In ITs and smoke specs replace only what we do not own: the LLM via the scripted fake model, third-party HTTP via WireMock at the wire; never our own services, repositories or Redis consumers.", "source": "R19 (scripted models in openai-agents, langgraph, OpenHands; ours fake-llm #576/#608); R20 Testcontainers WireMock guide; gap FakeAgentChatPort unused", "rw": 34, "ow": 12}, {"line": 37, "id": "TM3", "reason": "because a small model will not repeat exact wording, so text checks fail falsely", "kind": "evidence", "cite": "research/31a-v2.md:283", "basis": "Adapted Bad: ungated real-model IT asserts exact wording a 1.7B model will not reproduce.", "ref": "testing/references/strategy.md", "rule": "A small real-LLM tier runs key end-to-end scenarios (chat, tool call, memory, eval) against a real model (local Ollama by default) with structural assertions only (shape, tool called, no error; never exact wording); opt-in, never in make verify; must pass before a release and when prompt or provider code changes.", "source": "R19 spring-ai/langchain4j key-gated ITs; ours OLLAMA=true ITs (Makefile:204-208) + 26 @llm smoke specs", "rw": 50, "ow": 14}, {"line": 38, "id": "TM4", "reason": "NO-REASON", "kind": "none", "cite": "research/31a-v2.md:307; research/48-rule-source-audit.md:3 (TM4 row)", "basis": "Toxiproxy docs give the capability only; no fault-injection IT exists and no failure is recorded.", "ref": "testing/references/integration-tests.md", "rule": "For each infrastructure dependency the platform must survive (Postgres, Redis, LLM provider HTTP) at least one IT puts Toxiproxy (Testcontainers module) between app and container and injects latency, timeout and connection cut; asserts predictable failure, WARN/ERROR logs, recovery after the fault clears. One IT per dependency, not every IT. REQ must check BOM management of the module first.", "source": "Testcontainers Toxiproxy module; mastra stores/pg pooler tests; C2; CLAUDE.md observability", "rw": 58, "ow": 0}, {"line": 39, "id": "IT5", "reason": "because an untested fake drifts from the real adapter it replaces", "kind": "stated", "cite": "research/24-fakes-vs-mocks.md:26,81", "basis": "SWE at Google ch.13: a fake must have its own tests; an untested fake drifts like a mock.", "ref": "testing/references/integration-tests.md", "rule": "Every fake port has a contract spec running the same behaviours against both the fake and the real adapter (real one on Testcontainers); a change to the port or real adapter updates the contract spec in the same MR.", "source": "R19 langchain4j Abstract*IT, langgraph one suite over many backends; R20 SWE at Google ch.13; today 31 @TestBean fake files, no contract spec", "rw": 39, "ow": 11}, {"line": 41, "id": "K1", "reason": "because checks inside a nested closure such as every{} are never asserted", "kind": "stated", "cite": "research/20-spock-verification.md:17", "basis": "Spock release notes: top-level closure lines are implicit assertions; nested closures like .every{} are not asserted.", "ref": "testing/references/spock.md", "rule": "In a mock-argument closure write each check as a plain line (Spock \u22651.3 asserts every top-level line); lines inside a nested closure (every{}) are not asserted; for many fields of one object use verifyAll(it, Type){\u2026}. Replaces rules/it-testing.md rule 1 (wrong).", "source": "Spock release_notes.adoc:946; interaction_based_testing.adoc:245; local probe (R16)", "rw": 40, "ow": 12}, {"line": 42, "id": "K2", "reason": "because a given: stub plus a then: count makes the call return null", "kind": "stated", "cite": "research/20-spock-verification.md:45", "basis": "interaction_based_testing:744-746 and probe P4: stubbing in given: with 1 * in then: returns null.", "ref": "testing/references/spock.md", "rule": "When a call must both return something and be verified, write one interaction (1 * repo.save(_) >> saved); never stub in given: and count again in then: (the then: interaction overrides the stub \u2192 returns null).", "source": "Spock interaction_based_testing.adoc:734-746; probe P4 (R16)", "rw": 36, "ow": 13}, {"line": 43, "id": "K2b", "reason": "because a wildcard argument lets a call with the wrong value pass", "kind": "evidence", "cite": "research/31b-v2.md:709", "basis": "PipelineRepositoryAdapterSpec uses _ for a known id; deleting another pipeline's steps would still pass.", "ref": "testing/references/spock.md", "rule": "In a verified interaction (N * \u2026) match arguments by real values or a constraint closure on the fields that matter; use _ / *_ only when the argument is not part of what the feature promises or cannot be known in the test (generated id, timestamp \u2014 then constrain what you can). K2 example becomes 1 * repo.save({ it.name == \"triage\" }) >> saved.", "source": "SRC1 (2026-10-03): Spock 2.3 interaction_based_testing \u00a7Argument Constraints ('describe only what's relevant') \u2713 partial \u00b7 the obligation to constrain promised args = PROJECT DECISION (operator, G9a) \u00b7 evidence: OURS (no primary source found); follows from S2 + K1", "rw": 65, "ow": 12}, {"line": 44, "id": "K3", "reason": "because a Stub given a call count throws InvalidSpecException", "kind": "stated", "cite": "research/20-spock-verification.md:35", "basis": "interaction_based_testing:788-797 and probe P2: a cardinality on a Stub throws InvalidSpecException.", "ref": "testing/references/spock.md", "rule": "A Stub() never gets a call count (Spock throws InvalidSpecException); if the call must be verified it is a Mock(). Stub returns empty values (\"\", [], 0), not null.", "source": "Spock interaction_based_testing.adoc:785-788; probe P2 (R16)", "rw": 29, "ow": 9}, {"line": 45, "id": "K4", "reason": "because asserting incidental calls breaks the test when someone adds a log line", "kind": "stated", "cite": "~/.claude/skills/synced/\u2026/spock-best-practices/references/anti-patterns.md:11", "basis": "Over-specification: the test breaks every time someone adds a log line or a metric.", "ref": "testing/references/spock.md", "rule": "Assert only the interactions the feature name promises (mocks are lenient by default); use 0 * _ only when \"nothing else is called\" is itself the behaviour.", "source": "Spock interaction_based_testing.adoc:68-82, :290-306; V2", "rw": 27, "ow": 13}, {"line": 46, "id": "K5", "reason": "because a counted retry breaks the test when the retry policy changes", "kind": "stated", "cite": "~/.claude/skills/synced/\u2026/spock-best-practices/references/anti-patterns.md:97", "basis": "Brittle counts: bumping retries from 2 to 3 breaks the test though behaviour is correct.", "ref": "testing/references/spock.md", "rule": "Use an exact count (N *) only when N is the contract (e.g. exactly one email); 0 * to assert something did not happen; never count logging, metrics or retry calls.", "source": "spock-best-practices anti-patterns.md:93-114; Spock interaction_based_testing.adoc:142; adapted", "rw": 31, "ow": 12}, {"line": 47, "id": "K6", "reason": "because without #var every iteration reports the same name", "kind": "evidence", "cite": "research/31a-v2.md:489", "basis": "Master's data-driven name ignored the scenario column, so every iteration reported the same title.", "ref": "testing/references/spock.md", "rule": "Data-driven features use a where: table (| between inputs, || before expected values) and name iterations with #var in the feature name; no @Unroll (default since Spock 2.0).", "source": "Spock data_driven_testing.adoc:118,:166,:503-575; R16 (skill outdated)", "rw": 28, "ow": 9}, {"line": 48, "id": "K7", "reason": "because where: cannot read instance fields or mocks; Spock rejects the spec", "kind": "stated", "cite": "research/20-spock-verification.md:53", "basis": "data_driven_testing:100 and probe P5: compile error, only @Shared and static fields accessible in where:.", "ref": "testing/references/spock.md", "rule": "where: reads only @Shared or static fields (never instance fields or mocks); put a plain discriminator value in the table and build mocks in given: from it.", "source": "Spock data_driven_testing.adoc:100; probe P5 (R16)", "rw": 27, "ow": 12}, {"line": 49, "id": "K8", "reason": "because a branch on a where: column hides two rules and a failure names neither", "kind": "stated", "cite": "~/.claude/skills/synced/\u2026/spock-best-practices/references/data-driven-testing.md:229; research/31b-v2.md:882", "basis": "An if on a where: column conflates throws and returns: two behaviours masquerading as one.", "ref": "testing/references/spock.md", "rule": "A data-driven feature tests one rule: no if on a where: column; throws-cases and returns-cases go into separate features.", "source": "spock-best-practices data-driven :205-255 (R16 confirmed); junk #8", "rw": 19, "ow": 15}, {"line": 50, "id": "K9", "reason": "because shared mutable state makes features pass alone and fail together", "kind": "stated", "cite": "~/.claude/skills/synced/\u2026/spock-best-practices/references/anti-patterns.md:201", "basis": "@Shared mutable state: test order becomes significant; tests pass individually and fail when run together.", "ref": "testing/references/spock.md", "rule": "@Shared only for expensive read-only resources; never mocks or mutable state in it; prefer instance fields (fresh per feature).", "source": "Spock spock_primer.adoc:63-84; interaction_based_testing.adoc:437-439; U1", "rw": 19, "ow": 11}, {"line": 51, "id": "K10", "reason": "because a helper's hidden interaction makes an empty then: block still assert", "kind": "stated", "cite": "~/.claude/skills/synced/\u2026/spock-best-practices/references/anti-patterns.md:231", "basis": "Interactions in helpers: the then: block looks empty but the test still passes because the helper asserts.", "ref": "testing/references/spock.md", "rule": "Interactions (1 * \u2026, >> \u2026) are written in the feature's own given:/then: blocks, never hidden in helpers; a helper that asserts is annotated @Verify/@VerifyAll (Spock 2.4) or uses explicit assert.", "source": "Spock interaction_based_testing.adoc:316; spock_primer.adoc:581-591", "rw": 31, "ow": 12}, {"line": 52, "id": "K11", "reason": "because then: interactions run before when:, so a variable set there is unset", "kind": "stated", "cite": "research/20-spock-verification.md:34,104; research/31b-v2.md:982", "basis": "interaction_based_testing:402-425: then: interactions are hoisted before when:, so a when:-assigned variable is not set.", "ref": "testing/references/spock.md", "rule": "then: interactions are hoisted before when: runs; variables an interaction uses are declared before when: (or inside interaction{}), never assigned in when:.", "source": "Spock interaction_based_testing.adoc:402-425", "rw": 22, "ow": 13}, {"line": 53, "id": "K12", "reason": "because Groovy obj.with{} gives one opaque condition, not one check per field", "kind": "evidence", "cite": "research/31b-v2.md:1014", "basis": "TokenUsageSpec .with{}: only the &&-chained return value is checked, one opaque condition.", "ref": "testing/references/spock.md", "rule": "To check several fields of one result use verifyAll(obj){\u2026} (reports every failing field); Spock with(obj){\u2026} if first-failure is fine; never Groovy obj.with{} (asserts nothing).", "source": "Spock spock_primer.adoc:606-691; release_notes.adoc:55-58", "rw": 24, "ow": 12}, {"line": 54, "id": "K13", "reason": "because and: imposes no order, so calls in the wrong order still pass", "kind": "stated", "cite": "research/20-spock-verification.md:46; research/31b-v2.md:1042", "basis": "interaction_based_testing:513-536: order holds only across then: blocks; and: adds none, reversed code passes.", "ref": "testing/references/spock.md", "rule": "Assert call order only when order is the contract, with consecutive then: blocks; and: imposes no order.", "source": "Spock interaction_based_testing.adoc:513-536; V5", "rw": 17, "ow": 13}, {"line": 55, "id": "K14", "reason": "because Spock ignores Jupiter isolation, so a global-state spec runs unprotected", "kind": "stated", "cite": "research/20-spock-verification.md:26; research/31b-v2.md:1050,1064", "basis": "parallel_execution:11-35: Spock ignores junit.jupiter parallel config; Jupiter @Isolated would be ignored.", "ref": "testing/references/spock.md", "rule": "Spock ignores junit.jupiter.execution.parallel.*; isolate a spec touching global state with @spock.lang.Isolated (class-only) or @ResourceLock, not Jupiter annotations. Correction owed to CLAUDE.md (\"unit tests class-parallel\" is JUnit-only; no SpockConfig.groovy \u2192 Spock specs run sequentially). Turning on Spock parallelism is a separate decision.", "source": "Spock parallel_execution.adoc:11-35; Isolated.java:27; R16; aruvii.test-conventions.gradle.kts:32-34", "rw": 41, "ow": 11}, {"line": 56, "id": "K15", "reason": "because each @SpringBean forks a new uncached Spring context", "kind": "stated", "cite": "research/20-spock-verification.md:61,83", "basis": "module_spring CAUTION: @SpringBean creates a unique, uncached ApplicationContext.", "ref": "testing/references/spock.md", "rule": "In Spring-context specs prefer fake ports (IT4b); @SpringBean (typed field assigned Mock()/Stub()) only at an external boundary, since each forks a new uncached Spring context.", "source": "Spock module_spring.adoc CAUTION; R20 Spring context caching; IT4b", "rw": 25, "ow": 9}, {"line": 57, "id": "K16", "reason": "because cleanup: runs after any failure, when variables may still be null", "kind": "stated", "cite": "research/20-spock-verification.md:64; research/31b-v2.md:1105", "basis": "spock_primer:466-475: cleanup runs on failure, locals may hold defaults; an NPE there masks the real failure.", "ref": "testing/references/spock.md", "rule": "cleanup: frees per-feature resources and is written defensively (resource?.close()); it runs after any failure with given:/when: variables possibly unset.", "source": "Spock spock_primer.adoc:466-475", "rw": 19, "ow": 12}, {"line": 58, "id": "K17", "reason": "because a spied subject has its own methods faked and verified, not run", "kind": "evidence", "cite": "research/31b-v2.md:1134; ~/.claude/skills/synced/\u2026/spock-best-practices/references/anti-patterns.md:170", "basis": "SetupServiceTest partial-mocks the subject and verifies its own methods; skill: overriding one method hides mixed concerns.", "ref": "testing/references/spock.md", "rule": "Never Spy() (or @SpringSpy / Mockito.spy) the class under test; a spy is a code smell \u2014 extract the method into an injected collaborator and stub/fake that. An existing spy in code an MR touches is refactored away in that MR (no legacy exception).", "source": "spock-best-practices anti-patterns.md:166-195 (R16); junk #6; CHANGED by operator: refactor, no legacy exception", "rw": 44, "ow": 13}, {"line": 59, "id": "K18", "reason": "because a mocked value object can lie about equals, hashCode and toString", "kind": "stated", "cite": "~/.claude/skills/synced/\u2026/spock-best-practices/references/anti-patterns.md:48", "basis": "Mocking value objects adds setup and the mock can lie about equals, hashCode, toString.", "ref": "testing/references/spock.md", "rule": "Records and value objects are constructed with the values the test needs, never Mock()ed.", "source": "spock-best-practices anti-patterns.md:44-64 (R16); junk #6", "rw": 14, "ow": 12}, {"line": 60, "id": "K19", "reason": "because an unbound thrown() passes for any exception, even an unrelated one", "kind": "evidence", "cite": "research/31b-v2.md:1187", "basis": "AgentCountByToolQueryIT: any exception passes, including one unrelated to the key constraint.", "ref": "testing/references/spock.md", "rule": "Bind an expected exception as def e = thrown(AruviiException) and assert what matters (error code, message); assert no exception with noExceptionThrown(); never a then: without a condition.", "source": "Spock spock_primer.adoc:340-380; CLAUDE.md typed AruviiException; junk #1", "rw": 27, "ow": 12}, {"line": 61, "id": "K20", "reason": "NO-REASON", "kind": "none", "cite": "research/20-spock-verification.md:20", "basis": "R16: report-output rationale UNSUPPORTED by Spock docs; rule kept on readability only, no failure stated.", "ref": "testing/references/spock.md", "rule": "A block description (given: \"\u2026\") says what the code does not \u2014 the scenario words, the why \u2014 never restates the code; labels are documentation, not report output. Replaces rules/it-testing.md rule 4 rationale.", "source": "Spock spock_primer.adoc:791-830; R16; U2", "rw": 33, "ow": 0}, {"line": 67, "id": "GT1", "reason": "because a reworded name makes a search for the scenario title find no test", "kind": "evidence", "cite": "research/31c-v2.md:621,631", "basis": "LoginBackoffPolicySpec rewords the scenario; a title search finds nothing; 1 of 9 sampled titles matched.", "ref": "testing/workflows/scenario-to-tests.md", "rule": "A test's name is the scenario title verbatim (an Outline appends \" \u2014 #placeholder\"); rewording a scenario in a test is a review finding.", "source": "Spock \u00a7Feature methods; Adzic SbE ch.9; Bad REQ-500:311 vs LoginBackoffPolicySpec:25; U2, K6", "rw": 24, "ow": 14}, {"line": 68, "id": "GT2", "reason": "because Given/When/Then kept in comments never appears in the test report", "kind": "evidence", "cite": "research/31d-v2.md:571; research/28-smoke-e2e-disposition.md:70", "basis": "smoke-06 keeps GWT in comments the report never shows; test.step is shown in the report.", "ref": "testing/workflows/scenario-to-tests.md", "rule": "Spock block descriptions repeat the scenario's Given/When/Then/And text; a Playwright e2e test uses one test.step(\"Given \u2026\") per step with the same text.", "source": "Spock \u00a7Specifications as Documentation; Playwright \u00a7test.step; U2, K20; 0 test.step today", "rw": 22, "ow": 11}, {"line": 69, "id": "GT3", "reason": "because a renamed column hid that the test fed counts, not the scenario's seconds", "kind": "evidence", "cite": "research/31c-v2.md:697", "basis": "LoginBackoffPolicySpec renamed backoff to expected; elsewhere fed failure counts where REQ-500 columns are seconds.", "ref": "testing/workflows/scenario-to-tests.md", "rule": "A Scenario Outline becomes a Spock where: table (or Jest test.each) with the Examples column names unchanged; an e2e test takes one representative row.", "source": "Spock \u00a7Data Driven Testing; jestjs.io \u00a7test.each; gherkin-to-test \u00a7Scope; Bad LoginBackoffPolicySpec backoff\u2192expected; V4", "rw": 24, "ow": 14}, {"line": 70, "id": "GT4", "reason": "because a javadoc mention gives no work-item number a search can find", "kind": "evidence", "cite": "research/31c-v2.md:720,735", "basis": "Traceability only as free javadoc; no work-item number or scenario id on any feature; 0 @Issue.", "ref": "testing/workflows/scenario-to-tests.md", "rule": "Each scenario's test carries @Issue(\"#NNN\") (Spock) or a Playwright issue annotation naming its work item, plus the GA2 scenario id in the name or annotation.", "source": "Spock extensions \u00a7@Issue; Playwright \u00a7test annotations; 0 uses today", "rw": 25, "ow": 12}, {"line": 71, "id": "GT5", "reason": "because a second-tier copy re-asserts what the owner proves and catches nothing new", "kind": "evidence", "cite": "research/31c-v2.md:767; refs/openclaw-openclaw/.agents/skills/test-audit/SKILL.md:23-26", "basis": "LoginThrottleServiceIT re-asserts a cap the unit spec owns and names no new risk.", "ref": "testing/workflows/scenario-to-tests.md", "rule": "Pick one owning tier per scenario by S1; add a second tier only when it catches a risk the first cannot see (e.g. smoke only if the UI must show the refusal).", "source": "S1, V4, IT1, TM1; gherkin-to-test step 1; junk #7", "rw": 32, "ow": 13}, {"line": 72, "id": "GT6", "reason": "NO-REASON", "kind": "none", "cite": "research/25-gherkin-to-every-tier.md:129; research/31c-v2.md:789", "basis": "Process decision (G3 Spec buckets); Bad shows no scenario-to-test table, but no failure recorded.", "ref": "testing/workflows/scenario-to-tests.md", "rule": "The MR description lists every scenario AC-id \u2192 tier \u2192 test file:line; the reviewer's Spec verdict marks any unlisted or unmatched scenario \"not done\".", "source": "G3 (Spec 4 buckets, fold Rpi.ts); C4", "rw": 24, "ow": 0}, {"line": 73, "id": "SP1", "reason": "because a different field name creates a different cached context", "kind": "stated", "cite": "research/26-spring-testing-docs.md:24,37", "basis": "Spring @TestBean docs: field name is part of the cache key; name consistently to avoid unnecessary contexts.", "ref": "testing/references/integration-tests.md", "rule": "When the same bean is overridden with @TestBean in several test classes, the field name is identical everywhere (a different name creates a different cached context).", "source": "Spring annotation-testbean.html (R22); IT4b; R20", "rw": 26, "ow": 10}, {"line": 74, "id": "SP2", "reason": "because the override is a bare object without transaction, cache or security advice", "kind": "stated", "cite": "research/26-spring-testing-docs.md:38", "basis": "Spring bean-overriding \u00a7AOP proxies: the override instance is a bare object.", "ref": "testing/references/integration-tests.md", "rule": "A @TestBean/fake replaces the bean bare (no @Transactional, @Cacheable, @Retryable, method security); never override a bean whose advice the IT asserts.", "source": "Spring bean-overriding \u00a7AOP proxies (R22)", "rw": 21, "ow": 13}, {"line": 75, "id": "SP3", "reason": "because server work commits in another thread and never rolls back", "kind": "stated", "cite": "research/26-spring-testing-docs.md:39; research/31b-v2.md:412", "basis": "Boot with-running-server: any transaction initiated on the server does not roll back; rows leak.", "ref": "testing/references/integration-tests.md", "rule": "Never @Transactional on a RANDOM_PORT IT expecting rollback (server commits in another thread); isolation comes from DatabaseResetExtension.", "source": "Spring Boot \u00a7with-running-server (R22)", "rw": 17, "ow": 11}, {"line": 76, "id": "SP4", "reason": "because unflushed changes skip the database check and give false positives", "kind": "stated", "cite": "research/26-spring-testing-docs.md:40", "basis": "Spring tx.html: failing to flush the ORM session can produce false positives.", "ref": "testing/references/integration-tests.md", "rule": "In @DataJpaTest specs call em.flush() before asserting a constraint or write.", "source": "Spring Boot \u00a7data-jpa; Spring tx.html (R22)", "rw": 11, "ow": 11}, {"line": 77, "id": "SP5", "reason": "because Boot otherwise swaps in an embedded database unlike production Postgres", "kind": "stated", "cite": "research/31b-v2.md:466; refs/plinth-pinned/322-\u2026-integration-tests.md:513", "basis": "Without replace = NONE Boot uses an embedded DB; plinth: H2 may diverge from PostgreSQL dialect.", "ref": "testing/references/integration-tests.md", "rule": "Slice tests (@DataJpaTest, @JdbcTest) use @AutoConfigureTestDatabase(replace = NONE) plus the singleton initializer; never an embedded DB.", "source": "Spring Boot \u00a7data-jpa (R22)", "rw": 16, "ow": 11}, {"line": 78, "id": "SP6", "reason": "because it closes the context and rebuilds it for every later test", "kind": "stated", "cite": "research/26-spring-testing-docs.md:42", "basis": "Spring @DirtiesContext docs: context removed from the cache and closed, then rebuilt.", "ref": "testing/references/integration-tests.md", "rule": "No @DirtiesContext without a one-line reason (it closes and rebuilds the context).", "source": "Spring annotation-dirtiescontext (R22)", "rw": 12, "ow": 12}, {"line": 79, "id": "SP7", "reason": "because each cached context holds its own pool, so connections grow per context", "kind": "evidence", "cite": "research/26-spring-testing-docs.md:43; research/31b-v2.md:499", "basis": "Initializer comment cites ~23 contexts \u00d7 Hikari 5; limit raised on an approximate count, no cache logging.", "ref": "testing/references/integration-tests.md", "rule": "When ITs slow down or DB connections grow, log org.springframework.test.context.cache at DEBUG and count contexts before raising limits (cache max 32, LRU).", "source": "Spring caching.html (R22)", "rw": 22, "ow": 13}, {"line": 80, "id": "SP8", "reason": "because each @DynamicPropertySource enters the cache key and forks a context", "kind": "stated", "cite": "research/26-spring-testing-docs.md:44", "basis": "Spring caching docs: contextCustomizers in the cache key include @DynamicPropertySource methods.", "ref": "testing/references/integration-tests.md", "rule": "Shared IT properties go in the singleton initializer, never a per-class @DynamicPropertySource (each enters the cache key).", "source": "Spring caching.html (R22)", "rw": 17, "ow": 11}, {"line": 81, "id": "SP9", "reason": "because an unpaused cached context keeps consuming during other classes' tests", "kind": "stated", "cite": "research/26-spring-testing-docs.md:45; research/31b-v2.md:563", "basis": "Spring context-pausing: idle contexts stop Lifecycle beans; ChatStreamConsumer keeps consuming until JVM exit.", "ref": "testing/references/integration-tests.md", "rule": "Redis consumers, schedulers and other SmartLifecycle beans stay pauseable so idle cached contexts stop consuming.", "source": "Spring context-pausing.html (R22)", "rw": 15, "ow": 11}, {"line": 82, "id": "SP10", "reason": "because the timed body runs in another thread and its writes commit", "kind": "stated", "cite": "research/26-spring-testing-docs.md:46", "basis": "Spring tx.html \u00a7Preemptive Timeouts: body runs in another thread and is not rolled back.", "ref": "testing/references/integration-tests.md", "rule": "No preemptive timeout (assertTimeoutPreemptively) in a transactional test.", "source": "Spring tx.html \u00a7preemptive timeouts (R22)", "rw": 8, "ow": 12}, {"line": 83, "id": "SP11", "reason": "because an explicit @ComponentScan disables slice filters, so slices load every bean", "kind": "stated", "cite": "research/26-spring-testing-docs.md:47; research/31b-v2.md:616", "basis": "Boot user-configuration-and-slicing: explicit @ComponentScan disables slice exclude filters.", "ref": "testing/references/integration-tests.md", "rule": "No explicit @ComponentScan on @SpringBootApplication (it disables slice exclude filters).", "source": "Spring Boot \u00a7user-configuration-and-slicing (R22)", "rw": 10, "ow": 12}, {"line": 85, "id": "M1", "reason": "NO-REASON", "kind": "none", "cite": "spring-skills mutation-testing/references/configuration.md:113-114; research/31c-v2.md:16-25", "basis": "Source says no gate until a real score exists; gives no failure; #456 reason not stated in text read.", "ref": "testing/references/mutation.md", "rule": "Mutation testing is a report, never a gate; mutationThreshold stays 0 until a measured score exists and the operator chooses one.", "source": "ours #456, dependencies.md \u00a76; corpus spring-skills :165 (R17)", "rw": 21, "ow": 0}, {"line": 86, "id": "M2", "reason": "because a test aimed at one mutant's line lets the next mutant there survive", "kind": "evidence", "cite": "research/31c-v2.md:54", "basis": "Bad kill test names a line, not a case, asserts non-null; next mutant on that line survives.", "ref": "testing/references/mutation.md", "rule": "Read a surviving mutant as a missing case: name the CORRECT/RIGHT-BICEP letter it breaks, then add that example test.", "source": "ours #505; pitest Conditionals Boundary \u2194 B3 (R17)", "rw": 19, "ow": 14}, {"line": 87, "id": "M3", "reason": "because one number mixes unreached code with unasserted code", "kind": "evidence", "cite": "research/31c-v2.md:70", "basis": "A single score mixes NO_COVERAGE and SURVIVED; the reader cannot tell which fix is needed.", "ref": "testing/references/mutation.md", "rule": "Report score and test strength (killed \u00f7 (killed+survived)); NO_COVERAGE = not reached, survived = not asserted.", "source": "pitest.org testStrengthThreshold (R17)", "rw": 16, "ow": 9}, {"line": 88, "id": "M4", "reason": "because excluding decision code hides its missing tests from the report", "kind": "stated", "cite": "spring-skills mutation-testing/references/exclusions.md:3-5", "basis": "Keep anything with a decision, even untested: a missing test must stay visible in the report.", "ref": "testing/references/mutation.md", "rule": "Exclude only code with no decision in it (wiring, config); never exclude to raise the number.", "source": "ours #505; corpus spring-skills :285 (R17)", "rw": 16, "ow": 11}, {"line": 89, "id": "M5", "reason": "because an over-matching glob looks exactly like a successful exclusion", "kind": "stated", "cite": "spring-skills mutation-testing/references/add-exclusion.md:132", "basis": "A glob that over-matches looks exactly like a successful exclusion; #505 avoidCallsTo added 14 survivors.", "ref": "testing/references/mutation.md", "rule": "After changing exclusions or avoidCallsTo, compare per-class mutant counts before and after; an over-matching glob looks like success.", "source": "corpus :413; ours #505 (+14 survivors) (R17)", "rw": 18, "ow": 10}, {"line": 90, "id": "M6", "reason": "because non-default mutators are unstable and flood the report with equivalent mutants", "kind": "stated", "cite": "jvm-skills .claude/skills/mutation-testing/SKILL.md:362", "basis": "Do not use ALL: docs flag those operators fairly unstable, equivalent-prone, false survivor noise.", "ref": "testing/references/mutation.md", "rule": "Keep PIT DEFAULTS mutators; never ALL (non-default operators unstable, equivalent mutants).", "source": "pitest.org mutators; corpus jvm-skills :355 (R17)", "rw": 11, "ow": 12}, {"line": 91, "id": "M7", "reason": "because targets are hard-coded to one module, so other modules mutate nothing", "kind": "stated", "cite": "research/21-mutation-and-property.md:90", "basis": "targetClasses hard-coded to guardrails; applying it elsewhere mutates nothing and failWhenNoMutations fails.", "ref": "testing/references/mutation.md", "rule": "Run make mutation after adding branching logic to aruvii-guardrails; for another module wire it in first and say so in the MR.", "source": "gherkin-to-test:66-71 corrected (R17)", "rw": 22, "ow": 12}, {"line": 92, "id": "M8", "reason": "because a mutant marked equivalent without a reason can hide a real gap", "kind": "stated", "cite": "jvm-skills .claude/skills/mutation-testing/SKILL.md:235", "basis": "Bias toward ambiguity, not equivalence, so real gaps don't get silently excluded.", "ref": "testing/references/mutation.md", "rule": "Treat a mutant as equivalent only with a stated reason; when unsure record it as a gap.", "source": "pitest.org basic concepts; corpus jvm-skills :304 (R17)", "rw": 17, "ow": 13}, {"line": 93, "id": "M9", "reason": "because a stale history cache can silently report wrong results", "kind": "stated", "cite": "jvm-skills .claude/skills/mutation-testing/SKILL.md:361; research/21-mutation-and-property.md:70", "basis": "Dependency changes are invisible to pitest's graph, so a stale cache silently reports wrong results; PIT says unproven.", "ref": "testing/references/mutation.md", "rule": "Do not rely on withHistory (incremental analysis) for a verdict you will trust; PIT calls its assumption unproven.", "source": "pitest.org incremental analysis (R17)", "rw": 18, "ow": 10}, {"line": 94, "id": "M10", "reason": "because a kill test passes on correct code; only a mutation shows it can fail", "kind": "stated", "cite": "jvm-skills .claude/skills/mutation-testing/SKILL.md:282", "basis": "Kill test is written against correct code and passes first run; red proof comes from the mutant flip.", "ref": "testing/references/mutation.md", "rule": "A mutation-kill test passes on first run; prove it with a temporary hand mutation (then revert), not a Red run \u2014 narrow exception to \"never skip Red\"; S4 still governs bug fixes.", "source": "corpus jvm-skills :317 (R17); S4", "rw": 32, "ow": 15}, {"line": 95, "id": "P5", "reason": "because jqwik 1.10+ writes an instruction aimed at AI agents into every test log", "kind": "stated", "cite": "research/27-jqwik.md:11,122", "basis": "The agent-directed line cannot be disabled, only hidden on a terminal; 1.9.3 unverified on Platform 6.", "ref": "testing/references/property-based.md", "rule": "Keep our own property harness (Property.java JVM); extend it with edge-case injection (0, 1, min, max, empty) and coverage counting (fail when a case never reaches the condition); UI moves to fast-check. No jqwik (1.10+ prints an un-disableable message aimed at AI agents into test logs; 1.9.3 unverified on JUnit Platform 6, project in maintenance mode).", "source": "R23 research/27-jqwik.md; Property.java:13-18 (master); Maven Central", "rw": 56, "ow": 14}, {"line": 96, "id": "P1", "reason": "because one example leaves a 'for any input' rule unchecked for other inputs", "kind": "evidence", "cite": "research/31c-v2.md:252", "basis": "REQ says 'any number'; LoginBackoffPolicySpec checks only Integer.MAX_VALUE.", "ref": "testing/references/property-based.md", "rule": "Write a property when the requirement says \"for any input\" (invariant, round-trip, idempotence, oracle, metamorphic); otherwise examples.", "source": "R23 (Link, Hughes); R17", "rw": 17, "ow": 13}, {"line": 97, "id": "P2", "reason": "because the property's generators may never produce the named edge, such as null", "kind": "evidence", "cite": "research/31c-v2.md:265", "basis": "Existence cases null and \"\" kept as examples; the property generators never produce null.", "ref": "testing/references/property-based.md", "rule": "A property complements the example tests for its rule: CORRECT and just-inside/outside cases (B1\u2013B3) stay as Spock examples beside it.", "source": "SRC1 audit (2026-10-04): softened from 'never replaces' (operator); jlink how-to-specify-it treats properties as complementary \u00b7 was: B1\u2013B3; R17", "rw": 20, "ow": 13}, {"line": 98, "id": "P3", "reason": "because a conditional property passed 1000 runs without once reaching its branch", "kind": "evidence", "cite": "research/31c-v2.md:288; research/21-mutation-and-property.md:48", "basis": "ToolOutputSanitizerPropertyTest javadoc: a version passed a thousand times having never reached the branch.", "ref": "testing/references/property-based.md", "rule": "Every conditional property counts which branch each case hits and fails if a branch is never reached (coverage counting added to our harness).", "source": "jqwik \u00a7Checking Coverage (idea); P5", "rw": 23, "ow": 12}, {"line": 99, "id": "P4", "reason": "because a fixed seed explores the same cases on every run", "kind": "evidence", "cite": "research/31c-v2.md:331; research/21-mutation-and-property.md:93", "basis": "UI harness default seed 0x5eed: every run explores the same 200 cases.", "ref": "testing/references/property-based.md", "rule": "Seed random per run and printed on failure; replay with it; never commit a fixed seed (UI 0x5eed goes); never retry a failing property.", "source": "R17/R23; Property.java seed(); fast-check seed docs", "rw": 24, "ow": 11}, {"line": 100, "id": "P6", "reason": "because random draws rarely hit edges; an empty string appears about 1 in 81", "kind": "evidence", "cite": "research/31c-v2.md:363", "basis": "Gen.java gives up edge-case injection; \"\" and max length appear only by chance (~1 in 81).", "ref": "testing/references/property-based.md", "rule": "Generators include edge cases (0, 1, min, max, empty) by default; turning them off needs a written reason.", "source": "jqwik EdgeCasesMode MIXIN (idea); P5; B1", "rw": 18, "ow": 14}, {"line": 101, "id": "P7", "reason": "because tagged-out properties left security invariants unrun by the main gate", "kind": "evidence", "cite": "research/31c-v2.md:369-371", "basis": "ToolOutputSanitizerPropertyTest javadoc: tagged and excluded, so security-defect invariants were not run by the gate (#440).", "ref": "testing/references/property-based.md", "rule": "A JVM property is a unit test: runs in make test, counts toward coverage, never tagged out of the gate.", "source": "SRC1 (2026-10-03): jqwik user guide \u00a7How to Use (runs with any JUnit 5 engine) \u2713 partial \u00b7 coverage + never tagged out = PROJECT DECISION (operator, G9a; #440) \u00b7 evidence: ours #440; Makefile:280-285", "rw": 20, "ow": 11}, {"line": 102, "id": "P8", "reason": "because a heavy filter discards most cases and the property passes vacuously", "kind": "stated", "cite": "research/27-jqwik.md:80; research/31c-v2.md:411", "basis": "jqwik fails past maxDiscardRatio, Hypothesis ends Unsatisfiable; Bad filter discards nearly every case.", "ref": "testing/references/property-based.md", "rule": "Build generators by mapping/combining, not filtering; filter only for rare rejects; never loosen the discard limit to pass.", "source": "jqwik \u00a7Assumptions; Hypothesis (R23)", "rw": 18, "ow": 12}, {"line": 103, "id": "P10", "reason": "because without the printed seed a failing run cannot be replayed", "kind": "stated", "cite": "research/48-rule-source-audit.md:61 (P10 row)", "basis": "fast-check read-test-reports: the failure report gives the seed needed to reproduce.", "ref": "testing/references/property-based.md", "rule": "UI properties use fast-check with the seed printed, numRuns explicit, no retries.", "source": "fast-check docs; playwright.property.config.ts (R23)", "rw": 12, "ow": 11}, {"line": 104, "id": "EA1", "reason": "because a poll returns silently on timeout, so the test passes without the feature", "kind": "evidence", "cite": "research/31d-v2.md:44,55", "basis": "pollHistory returns silently on deadline; smoke-56 treats the poll as proof and asserts nothing.", "ref": "testing/references/smoke-specs.md", "rule": "Every test has an assertion that fails if the feature is removed; a polled condition is not an assertion; a non-obvious expect carries a message.", "source": "K-00, E9; Playwright best-practices (R24)", "rw": 25, "ow": 14}, {"line": 105, "id": "EA2", "reason": "because chrome or a shared CSS class renders on every page and proves nothing", "kind": "evidence", "cite": "research/31d-v2.md:80", "basis": "smoke-09 asserts .toggle-wrap, a class every settings page renders; proves no guardrail control rendered.", "ref": "testing/references/smoke-specs.md", "rule": "Assert a landmark only the feature renders, located by role, then label/text, test-id last; no app chrome, CSS class, XPath or dead route.", "source": "K-06, E1; Playwright locators (R24)", "rw": 23, "ow": 14}, {"line": 106, "id": "EA3", "reason": "because a catch or ?? [] default turns an error into a pass", "kind": "evidence", "cite": "research/31d-v2.md:116", "basis": "smoke-07: ?? [] before a check, so an error body yields [] and 'it disappeared' passes.", "ref": "testing/references/smoke-specs.md", "rule": "Nothing may turn a failure green: no catch around act-and-assert, no `|| true`, no `?? []` before a check, no expect only inside an if, no 2xx-or-4xx status sets.", "source": "K-04; scanner R11\u2013R13 (R24)", "rw": 29, "ow": 13}, {"line": 107, "id": "EA4", "reason": "because a reply or process success does not show the tool ran", "kind": "stated", "cite": "refs/openclaw-openclaw/.agents/skills/openclaw-docker-e2e-authoring/SKILL.md:25-26", "basis": "Fake servers log boundary requests; clients assert the real dependency payload, not just process success.", "ref": "testing/references/smoke-specs.md", "rule": "A test naming a tool asserts that tool's frame by name and that it succeeded (or paused for approval when that is the subject); an assistant reply alone never counts.", "source": "K-08, K-09; TM3 (R24)", "rw": 30, "ow": 12}, {"line": 108, "id": "EA5", "reason": "because a fake success frame for a dead dependency would stay green", "kind": "evidence", "cite": "research/31d-v2.md:181", "basis": "Adapted smoke-65 N08: reply-only check; a regression returning a fake success frame stays green.", "ref": "testing/references/smoke-specs.md", "rule": "A test making a dependency fail on purpose asserts the failure shape: a reply still arrives and no successful frame exists for it.", "source": "K-10; smoke-65 (R24)", "rw": 23, "ow": 12}, {"line": 109, "id": "EA6", "reason": "because a swallowed setup failure makes later tests fail or skip for hidden reasons", "kind": "evidence", "cite": "research/31d-v2.md:217", "basis": "smoke-41 fixture swallows setup failure; later tests fail or skip for a reason the report never shows.", "ref": "testing/references/smoke-specs.md", "rule": "Skip only on a named missing capability with a reason; own failed setup throws; quarantine only via test.fixme naming an open issue, removed when it closes.", "source": "Playwright annotations; Google flaky-test quarantine (R24)", "rw": 26, "ow": 14}, {"line": 110, "id": "EB1", "reason": "because data[0] returns the newest workspace, often another worker's", "kind": "evidence", "cite": "research/28-smoke-e2e-disposition.md:294; research/31d-v2.md:254", "basis": "api-helpers: data[0] is the newest workspace, the #309 flake; defaultWorkspaceId exists.", "ref": "testing/references/smoke-specs.md", "rule": "Users, workspaces, providers and scripted agents come from support/fixtures.ts (imported with test/expect); setup used by 2+ specs becomes a fixture; the seeded workspace comes from defaultWorkspaceId, never data[0] (#309).", "source": "K-01, K-11, E8; Playwright test-fixtures (R24)", "rw": 29, "ow": 9}, {"line": 111, "id": "EB2", "reason": "because in a serial chain one failure skips every later test", "kind": "evidence", "cite": "research/31d-v2.md:274", "basis": "smoke-69 serial header admits: a failure in one skips the rest of the chain.", "ref": "testing/references/smoke-specs.md", "rule": "Every test passes when run alone; describe.serial only for one expensive shared live call, with the reason above it.", "source": "K-02, K-05; Playwright parallelism (R24)", "rw": 19, "ow": 11}, {"line": 112, "id": "EB3", "reason": "because a failed or mutated beforeAll surfaces later as an unrelated wrong status", "kind": "evidence", "cite": "research/31d-v2.md:313; research/28-smoke-e2e-disposition.md:61", "basis": "smoke-06 setup status unchecked; failure surfaces later as wrong 401/403; beforeAll reruns per worker.", "ref": "testing/references/smoke-specs.md", "rule": "beforeAll only for read-only setup that throws on failure and is never mutated by tests.", "source": "K-03; Playwright test-retries (R24)", "rw": 15, "ow": 13}, {"line": 113, "id": "EB4", "reason": "because a third-party site then decides whether the test passes", "kind": "evidence", "cite": "research/31d-v2.md:349", "basis": "smoke-59 hits public httpbin.org in a @core block with no skip; the internet decides the branch.", "ref": "testing/references/smoke-specs.md", "rule": "Touch nothing we do not control: model via fake-llm or bundled Ollama; real internet only in @external tests with a skip when unreachable.", "source": "E11, TM2; Playwright best-practices; SWE@Google ch14 (R24)", "rw": 23, "ow": 10}, {"line": 114, "id": "EC1", "reason": "because tests that wait on time are flaky, as the Playwright docs warn", "kind": "stated", "cite": "research/22-playwright-frontend-testing.md:50 (K-07 row)", "basis": "Playwright: tests that wait for time are inherently flaky; networkidle DISCOURAGED for testing.", "ref": "testing/references/smoke-specs.md", "rule": "Never wait on time (no waitForTimeout, sleeps, networkidle); wait on a web-first assertion, response, URL, or expect.poll with a budget. New code; the 147 existing networkidle uses become a follow-up.", "source": "K-07, E4; Playwright page API (networkidle DISCOURAGED) (R24)", "rw": 30, "ow": 13}, {"line": 115, "id": "EC2", "reason": "because a one-shot read checks the page once, before it may settle", "kind": "stated", "cite": "research/48-rule-source-audit.md:73 (EC2 row); research/31d-v2.md:417", "basis": "Playwright best-practices: use auto-retrying web-first assertions, not expect(await ...isVisible()).", "ref": "testing/references/smoke-specs.md", "rule": "Check page state with retrying matchers (toHaveText, toHaveAttribute, toBeVisible); never expect(await locator.x()).", "source": "E2; Playwright test-assertions (R24)", "rw": 12, "ow": 12}, {"line": 116, "id": "EC3", "reason": "because .first() picks whichever match comes first, which changes with the page", "kind": "evidence", "cite": "research/31d-v2.md:447", "basis": "smoke-04: .first() silences strictness; 'first menu item' happens to be Edit today.", "ref": "testing/references/smoke-specs.md", "rule": "New code: no .first()/.nth()/.last() to escape a strictness error; narrow by role name, filter or chaining.", "source": "E3; Playwright locators (R24)", "rw": 16, "ow": 12}, {"line": 117, "id": "EC4", "reason": "because an un-awaited expect can end the test green before it checks", "kind": "evidence", "cite": "research/31d-v2.md:473", "basis": "Adapted smoke-17: un-awaited toBeVisible returns an unread promise; the test ends green before the check.", "ref": "testing/references/smoke-specs.md", "rule": "Every Playwright call and expect is awaited, enforced by no-floating-promises over playwright/ (eslint config change).", "source": "E6; Playwright best-practices lint (R24)", "rw": 15, "ow": 12}, {"line": 118, "id": "EC5", "reason": "because a poll that outlasts the test timeout dies without its failure message", "kind": "evidence", "cite": "research/31d-v2.md:495,502", "basis": "840 s poll ends before 900 s timeout, so the poll's message reports; smoke-78 10-minute timeout has no reason.", "ref": "testing/references/smoke-specs.md", "rule": "Raise a timeout only for a named slow dependency (live model) with a one-line reason; a poll budget stays below the test timeout.", "source": "E5; Playwright test-timeouts (R24)", "rw": 23, "ow": 13}, {"line": 119, "id": "EC6", "reason": "because retries and longer timeouts hide the real cause of a flake", "kind": "stated", "cite": "research/28-smoke-e2e-disposition.md:34; research/31d-v2.md:527", "basis": "Micco 2016: reruns hide real problems; smoke-69 timeout raised for contention hides the queueing.", "ref": "testing/references/smoke-specs.md", "rule": "A pass on retry is a flake: read check-flaky output and fix the cause; never add retries, serial or timeouts to make it green.", "source": "E10; Playwright test-retries; Google Micco 2016 (R24)", "rw": 24, "ow": 12}, {"line": 121, "id": "ED2", "reason": "because the scripted reply is the test's own input, so checking it proves nothing", "kind": "stated", "cite": "refs/openclaw-openclaw/.agents/skills/openclaw-docker-e2e-authoring/SKILL.md:25-26; research/31d-v2.md:591", "basis": "Fakes log requests and tests assert the payload; asserting scripted text is fixture-asserts-fixture.", "ref": "testing/references/smoke-specs.md", "rule": "Every model-reaching test tags @model:scripted (asserting the fake model's recorded requests + history, never its scripted text) or @model:real + @llm.", "source": "K-17; openclaw docker-e2e (R24)", "rw": 21, "ow": 14}, {"line": 122, "id": "ED3", "reason": "because a spec that never drives the route passes while the screen is broken", "kind": "evidence", "cite": "research/31d-v2.md:639", "basis": "smoke-24 'Test Run' spec types into the first input; the test-run route is never driven.", "ref": "testing/references/smoke-specs.md", "rule": "A feature's spec drives its route in the UI at least once and asserts every status the change introduces, including its refusal path; drops the named-screenshot mandate (K-14).", "source": "K-15; GA5 (R24)", "rw": 28, "ow": 14}, {"line": 123, "id": "ED4", "reason": "NO-REASON", "kind": "none", "cite": "research/48-rule-source-audit.md:81 (ED4 row); research/28-smoke-e2e-disposition.md:333", "basis": "Project tier decision (K-13); tag : "evidence", "cite": "agent-platform 71b5deb4:.agents/skills/migrations/references/review.md:161-163", "basis": "V25 exists because the mixture silently dropped rows from BETWEEN comparisons", "ref": "migrations/references/postgres-design.md", "rule": "Timestamps are `timestamptz`, with no precision spec.", "source": "SRC1: `PG-WIKI` \"Don't use the timestamp type to store timestamps, use timestamptz\" + \"Don't use a precision specification\" \u2014 V25 exists because mixing dropped `BETWEEN` rows (`skel:review.md:161-163`)", "rw": 7, "ow": 11}, {"line": 485, "id": "MG31", "reason": "NO-REASON", "kind": "none", "cite": "research/60a-g9c-migrations.md:60", "basis": "PG: no performance difference; wiki says avoid varchar(n); no failure stated", "ref": "migrations/references/postgres-design.md", "rule": "New string columns are `TEXT`; a business length is `CHECK (length(col) <= n)`; existing `VARCHAR` stays.", "source": "SRC1: `PG-CHR` 8.3 \"no performance difference among these three types\"; `PG-WIKI` \"Don't use the type varchar(n) by default\" \u2014 **P1 N2 Bad** V106 @`70b84c0b`:8,20 `VARCHAR(20)/(40)`; **Good** m:`V106:8,22-26` TEXT + CHECK", "rw": 16, "ow": 0}, {"line": 486, "id": "MG32", "reason": "because the default `NO ACTION` is a delete behaviour nobody chose", "kind": "stated", "cite": "research/60a-g9c-migrations.md:61; agent-platform 71b5deb4:.claude/rules/migrations.md:94-95", "basis": "PG default ON DELETE NO ACTION is silent; skel: a decision nobody made", "ref": "migrations/references/postgres-design.md", "rule": "Every `REFERENCES` states `ON DELETE` (`CASCADE`, `SET NULL` or `RESTRICT`).", "source": "SRC1: `PG-CON` 5.5.5 \"The default `ON DELETE` action is `ON DELETE NO ACTION`\" (the default is silent) \u2014 m:`V101:29` (Good)", "rw": 10, "ow": 11}, {"line": 487, "id": "MG33", "reason": "because an unindexed FK makes each parent delete scan the child under locks", "kind": "stated", "cite": "agent-platform 71b5deb4:.claude/rules/migrations.md:35-36", "basis": "PG does not index FK; unindexed FK makes parent delete scan child holding locks", "ref": "migrations/references/postgres-design.md", "rule": "Index every foreign-key column.", "source": "SRC1: `PG-CON` 5.5.5 \"does not automatically create an index on the referencing columns\" \u2014 m:`V103` indexes V101's FK", "rw": 4, "ow": 13}, {"line": 488, "id": "MG34", "reason": "because a CHECK passes when the value is null", "kind": "stated", "cite": "research/60a-g9c-migrations.md:63", "basis": "PG-CON 5.5.1: check satisfied if expression is true or null", "ref": "migrations/references/postgres-design.md", "rule": "A `CHECK` on a nullable column either pairs with `NOT NULL` or says null is allowed.", "source": "SRC1: `PG-CON` 5.5.1 \"satisfied if the check expression evaluates to true or the null value\" \u2014 m:`V106:24-26` CHECK on nullable `verdict_reason` (null intended, unstated)", "rw": 16, "ow": 9}, {"line": 489, "id": "MG35", "reason": "because a nullable `UNIQUE` column still accepts duplicate null rows", "kind": "stated", "cite": "research/60a-g9c-migrations.md:64", "basis": "PG-CON 5.5.3: possible to store duplicate rows containing null", "ref": "migrations/references/postgres-design.md", "rule": "`UNIQUE` on a nullable column is not uniqueness; make it `NOT NULL`.", "source": "SRC1: `PG-CON` 5.5.3 \"possible to store duplicate rows that contain a null value\" \u2014 `skel:rules:107`", "rw": 12, "ow": 10}, {"line": 490, "id": "MG36", "reason": "NO-REASON", "kind": "none", "cite": "research/60a-g9c-migrations.md:65", "basis": "PG wiki 'don't use' headings quoted only; no failure stated", "ref": "migrations/references/postgres-design.md", "rule": "Never `timetz`, `money`, `serial`, `char(n)`; ids are `uuid DEFAULT gen_random_uuid()`, money `NUMERIC(p,s)`.", "source": "SRC1: `PG-WIKI` \"Don't use the timetz type\", \"Don't use the type char(n)\", \"identity columns should be used instead\" \u2014 `skel:rules:108-111`", "rw": 12, "ow": 0}, {"line": 491, "id": "MG37", "reason": "NO-REASON", "kind": "none", "cite": "research/60a-g9c-migrations.md:66", "basis": "PG docs prefer jsonb and describe GIN; no failure stated", "ref": "migrations/references/postgres-design.md", "rule": "`JSONB`, never `JSON`; a filtered JSONB path gets a GIN (`jsonb_path_ops` for containment) index.", "source": "SRC1: `PG-JSON` 8.14 \"most applications should prefer to store JSON data as `jsonb`\"; 8.14.4 GIN \u2014 `skel:rules:102-105`", "rw": 14, "ow": 0}, {"line": 492, "id": "MG38", "reason": "because generated names cannot be reviewed or asserted in tests", "kind": "stated", "cite": "agent-platform 71b5deb4:.claude/rules/migrations.md:33-34", "basis": "generated names are unreviewable and unassertable", "ref": "migrations/references/postgres-design.md", "rule": "Name every constraint and index (`pk_`/`uq_`/`ck_`/`fk_`/`idx_`).", "source": "SRC1: **project decision?** no reference read \u2014 generated names unassertable (`skel:rules:33-34`)", "rw": 6, "ow": 10}, {"line": 493, "id": "MG42", "reason": "because the invented marker cost a day, and a `.conf` sidecar changes nothing", "kind": "evidence", "cite": "agent-platform 71b5deb4:.claude/rules/migrations.md:20-27", "basis": "nonTransactional marker exists in no Flyway edition, #109 lost a day; .conf measured no-op #154", "ref": "migrations/references/postgres-design.md", "rule": "No `-- flyway:nonTransactional` marker, no `.conf` sidecar; the migrator's `postgresql.transactional-lock: false` is the mechanism.", "source": "SRC1: `FW-TL` \"should be set to `false` for statements such as `CREATE INDEX CONCURRENTLY`\" \u2014 #109 (invented marker), #154 (measured); m: still carries `V92__\u2026sql.conf`", "rw": 14, "ow": 13}, {"line": 494, "id": "MG50", "reason": "because two migrators race for the lock and already caused a startup hang", "kind": "evidence", "cite": "agent-platform 71b5deb4:.claude/rules/migrations.md:77-79", "basis": "two migrators: non-deterministic lock race; cost heck, full stop\" \u2014 `skel:flyway-migration:18-22` duplicates `check-migration-version.sh`", "rw": 12, "ow": 14}, {"line": 501, "id": "MG61", "reason": "because the old steps sent agents to a deleted `/dod` command", "kind": "evidence", "cite": "research/60a-g9c-migrations.md:23,89", "basis": "skel flyway-migration:10 names deleted /dod", "ref": ".agents/skills/flyway-migration/SKILL.md (flat)", "rule": "The skill's steps are: version (hook) \u2192 file \u2192 header (MG4) \u2192 SQL (MG41\u201347) \u2192 IT (MG19) \u2192 `make verify-module`.", "source": "SRC1: `pl-sk:46-62` (read \u2192 scope \u2192 apply \u2192 verify) \u2014 `skel:flyway-migration:10` names deleted `/dod`", "rw": 20, "ow": 11}, {"line": 502, "id": "MG62", "reason": "because `IF NOT EXISTS` skips an invalid index left by a failed build", "kind": "stated", "cite": "research/60a-g9c-migrations.md:70", "basis": "PG-IDX: IF NOT EXISTS gives no guarantee existing index is anything like the one requested", "ref": ".agents/skills/flyway-migration/SKILL.md (flat)", "rule": "`CREATE TABLE IF NOT EXISTS` / `ADD COLUMN IF NOT EXISTS` stay; `IF NOT EXISTS` on an index never replaces MG43.", "source": "SRC1: `pl-fw:74` \"Prefer idempotent-friendly DDL\u2026 (e.g. `IF NOT EXISTS`)\" \u2014 `skel:flyway-migration:37`", "rw": 21, "ow": 13}, {"line": 503, "id": "MG70", "reason": "because DDL safety had no gate, so these defects reached review", "kind": "evidence", "cite": "research/60a-g9c-migrations.md:94,173", "basis": "semgrep deleted, migration DDL safety ungated; P1 found F3/N2 only by review", "ref": "gates (L4 hook / runner)", "rule": "`scripts/check-migrations.sh` (in `make lint` and the runner) fails on: `timestamp` without tz, `varchar(` in a new file, `flyway:nonTransactional`, a `.conf` sidecar, `CONCURRENTLY` with another statement, `UPDATE`/`DELETE` without `WHERE` or comment.", "source": "SRC1: `matt-retro:19`; `pl-ap:135` \"Prefer CI checks that scan `V*__*.sql`\"; approved OQ3 (mechanical \u2192 gate) \u2014 semgrep deleted, \"migration DDL safety\" ungated (`skel:AGENTS.md:168,181`)", "rw": 30, "ow": 11}, {"line": 504, "id": "MG71", "reason": "because duplicate versions from two branches merged cleanly, then failed at startup", "kind": "evidence", "cite": "research/60a-g9c-migrations.md:95; agent-platform 71b5deb4:.claude/rules/migrations.md:42-44", "basis": "#500, #161 merged cleanly; collisions fail at container startup", "ref": "gates (L4 hook / runner)", "rule": "A runner job fails when two `V` files share a version in the merged set, and runs the full chain from empty.", "source": "SRC1: `pl-ap:135` \"fail when two files share the same V* prefix\u2026 run the full migration chain from an empty database\" (`:141-143`) \u2014 #500, #161 merged cleanly", "rw": 22, "ow": 12}, {"line": 505, "id": "MG72", "reason": "because two worktrees took one version after each ran a correct check", "kind": "evidence", "cite": "research/60a-g9c-migrations.md:96", "basis": "hook reads git branch -r only; #502/#496 collided after a correct check", "ref": "gates (L4 hook / runner)", "rule": "`check-migration-version.sh` also reads local branches, so an unpushed sibling worktree counts.", "source": "SRC1: **project decision?** \u2014 `check-migration-version.sh:23` `git branch -r` only; #502/#496 collided after a correct check", "rw": 11, "ow": 12}]}, {"key": "fowler-checkstyle", "name": "Fowler smells + Checkstyle gates", "items": [{"line": 532, "id": "SP22", "reason": "because S-6 claims a complexity gate that master's Checkstyle config does not have", "kind": "evidence", "cite": "research/58:93,135", "basis": "AP checkstyle.xml has neither CyclomaticComplexity nor Nested*Depth; S-6 'checked by' untrue", "ref": "checkstyle.xml + code/references/smells.md", "rule": "Wire the gates ADR-0017 S-6 / DS9 claim: Checkstyle `CyclomaticComplexity` and `NestedIfDepth` fail the build; exact limits from R37.", "source": "Spring Framework checkstyle.xml:70-78; research/58; operator 2026-10-04 (\"add checkstyle\")", "rw": 19, "ow": 13}, {"line": 534, "id": "X1", "reason": "because JV5 already stops `var` from hiding a type", "kind": "stated", "cite": "research/58:143 (X1)", "basis": "Spring bans var as a library read without IDE; ours is an app and JV5 limits var", "ref": "code/references/java.md (decided edge)", "rule": "Keep ST1/JV5 (`final var` when the right-hand side shows the type) although Spring's own code bans `var`: Spring is a library read without an IDE; JV5 already blocks hidden types.", "source": "Spring Framework CONTRIBUTING.md:596; research/58 X1; operator 2026-10-17", "rw": 30, "ow": 9}, {"line": 535, "id": "X3", "reason": "because an interface with only one implementation is extra effort with no substitution", "kind": "stated", "cite": "research/58:69 (MF/InterfaceImplementationPair)", "basis": "Fowler: interfaces without multiple implementations are extra effort in applications", "ref": "S-1 text (agent-platform #679)", "rule": "Pure decision seams are `final` classes with no interface; I/O seams keep an interface because tests fake them (consistent with LY2).", "source": "martinfowler.com/bliki/InterfaceImplementationPair.html; research/58 X3; operator 2026-10-17", "rw": 21, "ow": 13}, {"line": 536, "id": "X5", "reason": "because putting all logic in services leaves an anemic, behaviour-less domain model", "kind": "stated", "cite": "research/58:105,147 (MF/AnemicDomainModel)", "basis": "Fowler warns behaviour-less domain objects are an anti-pattern", "ref": "S-3 text (agent-platform #679) + smells.md (FW6)", "rule": "S-3 (decisions in pure policy classes) applies to decisions across objects; logic about one record stays on that record.", "source": "martinfowler.com/bliki/AnemicDomainModel.html, GetterEradicator; research/58 X5; operator 2026-10-17", "rw": 19, "ow": 12}, {"line": 537, "id": "FW1", "reason": "because a long constructor often signals an over-busy object; one has 32 parameters", "kind": "stated", "cite": "res   if (rj.length) parts.push("reject " + rj.map(i => i.id).join(", "));
  ch.forEach(i => parts.push(`change ${i.id}: ${((state[k(i)] || {}).note || "").trim() || "(no note)"}`));
  if (open.length) parts.push("undecided " + open.map(i => i.id).join(", "));
  return t + parts.join("; ");
}
function summary() {
  const g = groups.find(x => x.key === current), c = document.getElementById("count");
  if (!g || g.key === "excluded") { c.textContent = ""; return; }
  const n = v => g.items.filter(it => (state[k(it)] || {}).v === v).length;
  c.textContent = `${g.name}: ${n("approve")} approved · ${n("reject")} rejected · ${n("change")} to change · ${g.items.length - n("approve") - n("reject") - n("change")} undecided`;
}
["none", "over", "ev"].forEach(f => { const el = document.getElementById("f-" + f); el.onchange = () => { flt[f] = el.checked; render(); }; });
document.getElementById("all").onclick = () => {
  const g = groups.find(x => x.key === current); if (!g) return;
  g.items.forEach(it => { if (!(state[k(it)] || {}).v) state[k(it)] = { v: "approve" }; });
  save(); render();
};
document.getElementById("copy").onclick = () => {
  const g = groups.find(x => x.key === current); if (!g || g.key === "excluded") return;
  const t = decisionText(g), out = document.getElementById("out");
  out.textContent = t;
  try { navigator.clipboard.writeText(t).then(() => { out.textContent = "Copied. Paste it into the chat:\n" + t; }, () => { out.textContent = "Select and copy this line:\n" + t; }); }
  catch (e) { out.textContent = "Select and copy this line:\n" + t; }
};
render();
</script>
