<title>Rule Reasons Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one review column; each ledger rule shows its drafted "because" clause, the cite it came from, a decision row; sticky decision bar. Same palette as review/template.html. */
:root {
  --bg: #f6f7f5; --panel: #ffffff; --ink: #1d2320; --muted: #5d6762; --line: #dfe3df;
  --accent: #2f5d50; --good: #1f7a4d; --good-bg: #e8f4ec; --bad: #a33a2b; --bad-bg: #f8ebe8;
  --warn: #8a6100; --warn-bg: #fbf2dc; --code-bg: #f0f2ef;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141816; --panel: #1b201d; --ink: #e5ebe7; --muted: #9aa59f; --line: #2c332f;
  --accent: #7cc0a8; --good: #6fcf9a; --good-bg: #17291f; --bad: #f08a78; --bad-bg: #2e1b17;
  --warn: #e7c065; --warn-bg: #2b2414; --code-bg: #111512; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #141816; --panel: #1b201d; --ink: #e5ebe7; --muted: #9aa59f; --line: #2c332f;
  --accent: #7cc0a8; --good: #6fcf9a; --good-bg: #17291f; --bad: #f08a78; --bad-bg: #2e1b17;
  --warn: #e7c065; --warn-bg: #2b2414; --code-bg: #111512; color-scheme: dark }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--sans); }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 140px; }
header h1 { font-size: 1.5rem; margin: 0 0 4px; text-wrap: balance; }
header p { margin: 0; color: var(--muted); max-width: 72ch; }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 8px; }
.tab { font: 500 0.85rem var(--sans); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
.tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.tab:focus-visible, button:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.gsum { color: var(--muted); font-size: 0.85rem; margin: 4px 0 10px; font-variant-numeric: tabular-nums; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; font-size: 0.82rem; color: var(--muted); }
.filters label { display: flex; gap: 4px; align-items: center; cursor: pointer; }
.rule { border-top: 1px solid var(--line); padding-block: 18px; display: grid; gap: 8px; }
.rule-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: baseline; }
.rid { font: 600 0.95rem var(--mono); color: var(--accent); }
.ref { font: 0.75rem var(--mono); color: var(--muted); overflow-wrap: anywhere; }
.rtext { min-width: 0; }
.reason { min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; }
.reason .because { font-weight: 600; }
.reason.none { border-color: var(--bad); background: var(--bad-bg); }
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { font: 500 0.72rem var(--sans); padding: 2px 8px; border-radius: 999px; background: var(--code-bg); color: var(--muted); font-variant-numeric: tabular-nums; }
.chip.stated { background: var(--good-bg); color: var(--good); }
.chip.evidence { background: var(--warn-bg); color: var(--warn); }
.chip.none, .chip.over { background: var(--bad-bg); color: var(--bad); }
.cite { font: 0.75rem var(--mono); color: var(--muted); overflow-wrap: anywhere; }
.basis { font-size: 0.85rem; color: var(--muted); }
details { font-size: 0.8rem; color: var(--muted); }
details .src { font: 0.75rem var(--mono); overflow-wrap: anywhere; margin-top: 4px; }
.decide { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.decide button { font: 500 0.82rem var(--sans); padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
.decide button[aria-pressed="true"][data-v="approve"] { background: var(--good-bg); border-color: var(--good); color: var(--good); }
.decide button[aria-pressed="true"][data-v="reject"] { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
.decide button[aria-pressed="true"][data-v="change"] { background: var(--warn-bg); border-color: var(--warn); color: var(--warn); }
.decide textarea { flex: 1 1 100%; min-height: 54px; font: 0.85rem var(--sans); padding: 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
.excl { border-top: 1px solid var(--line); padding-block: 10px; display: grid; gap: 2px; font-size: 0.88rem; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar-in { max-width: 1040px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.count { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 0.85rem; flex: 1 1 260px; }
.bar button { font: 600 0.85rem var(--sans); padding: 8px 14px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: var(--bg); cursor: pointer; }
.bar button.ghost { background: transparent; color: var(--accent); }
#out { flex: 1 1 100%; font: 0.78rem var(--mono); white-space: pre-wrap; color: var(--muted); max-height: 30vh; overflow: auto; }
@media (prefers-reduced-motion: no-preference) { .tab, .decide button { transition: background .15s, color .15s; } }
</style>

<div class="wrap">
  <header>
    <h1>Rule Reasons Review</h1>
    <p>skills #98 (map #9, G21 #91). Each approved rule gets one "because" clause, drafted from its own cited source. Rule wording is unchanged. Approve a group, change single reasons, then copy the decision line into the chat.</p>
  </header>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="gsum" id="gsum"></div>
  <div class="filters" id="filters">
    <label><input type="checkbox" id="f-none"> only NO-REASON</label>
    <label><input type="checkbox" id="f-over"> only over 35 words</label>
    <label><input type="checkbox" id="f-ev"> only evidence-based</label>
  </div>
  <main id="list"></main>
</div>
<div class="bar"><div class="bar-in">
  <span class="count" id="count"></span>
  <button class="ghost" id="all">Approve the rest of this group</button>
  <button id="copy">Copy decision</button>
  <div id="out" aria-live="polite"></div>
</div></div>

<script>
const DATA = /*DATA*/{"groups":[],"excluded":[]};
const KEY = "rule-reasons-v1";
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { state = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
const groups = DATA.groups.concat(DATA.excluded.length ? [{ key: "excluded", name: "Not rules (excluded)", items: [] }] : []);
let current = groups.length ? groups[0].key : null;
try { const h = location.hash.slice(1); if (groups.some(g => g.key === h)) current = h; } catch (e) {}
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const k = it => it.id + "@" + it.line;
const flt = { none: false, over: false, ev: false };

function renderTabs() {
  const t = document.getElementById("tabs");
  t.innerHTML = groups.map(g => `<button class="tab" role="tab" aria-selected="${g.key === current}" data-k="${g.key}">${esc(g.name)} · ${g.key === "excluded" ? DATA.excluded.length : g.items.length}</button>`).join("");
  t.querySelectorAll(".tab").forEach(b => b.onclick = () => { current = b.dataset.k; try { history.replaceState(null, "", "#" + current); } catch (e) {} render(); });
}
function itemHtml(it) {
  const d = state[k(it)] || {};
  const none = it.kind === "none";
  const total = it.rw + it.ow;
  return `<article class="rule" data-k="${esc(k(it))}">
    <div class="rule-head"><span class="rid">${esc(it.id)}</span><span class="ref">${esc(it.ref)}</span></div>
    <div class="rtext">${esc(it.rule)}</div>
    <div class="reason ${none ? "none" : ""}">
      <div class="because">${esc(it.reason)}</div>
      <div class="meta">
        <span class="chip ${esc(it.kind)}">${none ? "no reason found: flag for deletion" : it.kind === "stated" ? "source states it" : "from evidence"}</span>
        <span class="chip ${total > 35 ? "over" : ""}">rule ${it.rw} + reason ${it.ow} = ${total} words${total > 35 ? " · over 35" : ""}</span>
      </div>
      <div class="cite">${esc(it.cite)}</div>
      ${it.basis ? `<div class="basis">${esc(it.basis)}</div>` : ""}
    </div>
    <details><summary>Ledger source cell (line ${it.line})</summary><div class="src">${esc(it.source)}</div></details>
    <div class="decide">
      ${["approve", "reject", "change"].map(v => `<button data-v="${v}" aria-pressed="${d.v === v}">${v === "change" ? "Change…" : v === "reject" ? (none ? "Delete rule" : "Reject reason") : "Approve"}</button>`).join("")}
      <textarea id="note-${esc(k(it))}" placeholder="New reason, or what to fix" ${d.v === "change" ? "" : "hidden"}>${esc(d.note || "")}</textarea>
    </div></article>`;
}
function visible(g) {
  return g.items.filter(it => (!flt.none || it.kind === "none") && (!flt.over || it.rw + it.ow > 35) && (!flt.ev || it.kind === "evidence"));
}
function render() {
  renderTabs();
  const list = document.getElementById("list"), gs = document.getElementById("gsum");
  const g = groups.find(x => x.key === current);
  document.getElementById("filters").hidden = !g || g.key === "excluded";
  if (!g) { list.innerHTML = "<p>No groups loaded.</p>"; return; }
  if (g.key === "excluded") {
    gs.textContent = `${DATA.excluded.length} ledger rows marked APPROVED or DECIDED that are not author rules. They get no reason. Say so in the chat if one is a real rule.`;
    list.innerHTML = DATA.excluded.map(e => `<div class="excl"><div><span class="rid">${esc(e.id)}</span> <span class="ref">${esc(e.why)}</span></div><div>${esc(e.rule)}</div></div>`).join("");
    summary(); return;
  }
  const n = f => g.items.filter(f).length;
  gs.textContent = `${g.items.length} rules · ${n(i => i.kind === "stated")} stated by source · ${n(i => i.kind === "evidence")} from evidence · ${n(i => i.kind === "none")} NO-REASON · ${n(i => i.rw + i.ow > 35)} over 35 words`;
  const vis = visible(g);
  list.innerHTML = vis.length ? vis.map(itemHtml).join("") : "<p>No rules match the filter.</p>";
  list.querySelectorAll(".rule").forEach(a => {
    const key = a.dataset.k;
    a.querySelectorAll(".decide button").forEach(b => b.onclick = () => { state[key] = { ...(state[key] || {}), v: b.dataset.v }; save(); render(); });
    const ta = a.querySelector("textarea");
    ta.oninput = () => { state[key] = { ...(state[key] || {}), v: "change", note: ta.value }; save(); summary(); };
  });
  summary();
}
function decisionText(g) {
  const st = it => (state[k(it)] || {}).v;
  const ap = g.items.filter(i => st(i) === "approve"), rj = g.items.filter(i => st(i) === "reject"), ch = g.items.filter(i => st(i) === "change");
  const open = g.items.filter(i => !st(i));
  let t = `#98 reasons · ${g.name}: `;
  if (ap.length === g.items.length) return t + "approve all";
  const parts = [];
  if (ap.length) parts.push(`approve ${ap.length}`);
  if (rj.length) parts.push("reject " + rj.map(i => i.id).join(", "));
  ch.forEach(i => parts.push(`change ${i.id}: ${((state[k(i)] || {}).note || "").trim() || "(no note)"}`));
  if (open.length) parts.push("undecided " + open.map(i => i.id).join(", "));
  return t + parts.join("; ");
}
function summary() {
  const g = groups.find(x => x.key === current), c = document.getElementById("count");
  if (!g || g.key === "excluded") { c.textContent = ""; return; }
  const n = v => g.items.filter(it => (state[k(it)] || {}).v === v).length;
  c.textContent = `${g.name}: ${n("approve")} approved · ${n("reject")} rejected · ${n("change")} to change · ${g.items.length - n("approve") - n("reject") - n("change")} undecided`;
}
["none", "over", "ev"].forEach(f => { const el = document.getElementById("f-" + f); el.onchange = () => { flt[f] = el.checked; render(); }; });
document.getElementById("all").onclick = () => {
  const g = groups.find(x => x.key === current); if (!g) return;
  g.items.forEach(it => { if (!(state[k(it)] || {}).v) state[k(it)] = { v: "approve" }; });
  save(); render();
};
document.getElementById("copy").onclick = () => {
  const g = groups.find(x => x.key === current); if (!g || g.key === "excluded") return;
  const t = decisionText(g), out = document.getElementById("out");
  out.textContent = t;
  try { navigator.clipboard.writeText(t).then(() => { out.textContent = "Copied. Paste it into the chat:\n" + t; }, () => { out.textContent = "Select and copy this line:\n" + t; }); }
  catch (e) { out.textContent = "Select and copy this line:\n" + t; }
};
render();
</script>
