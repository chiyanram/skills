<style>
/* Layout: one narrow reading column; a role flow at the top, then one card per stage you approve or change. */
:root{

  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121615; --surface:#1a201e; --fg:#e4ebe8; --muted:#9aa6a1; --line:#2c3532;
  --accent:#5cc4ae; --accent-soft:#1d3530;
  --analyst:#b49aff; --spec:#e9a35d; --dev:#73b2ea; --qa:#5cc4ae; --human:#ef7f8c; --coord:#9aa6a1;
  --ok:#5fcf8b; --warn:#e6a54a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121615; --surface:#1a201e; --fg:#e4ebe8; --muted:#9aa6a1; --line:#2c3532;
  --accent:#5cc4ae; --accent-soft:#1d3530;
  --analyst:#b49aff; --spec:#e9a35d; --dev:#73b2ea; --qa:#5cc4ae; --human:#ef7f8c; --coord:#9aa6a1;
  --ok:#5fcf8b; --warn:#e6a54a; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;margin:0}
.wrap{max-width:780px;margin:0 auto;padding-inline:16px;padding-block:28px 64px}
h1{font-size:1.75rem;line-height:1.2;margin:0 0 4px;text-wrap:balance}
h2{font-size:1.15rem;margin:36px 0 10px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 20px}
.mono,code,pre{font-family:var(--mono);font-size:.85em}
code{background:var(--accent-soft);padding:1px 5px;border-radius:4px}
pre{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;overflow-x:auto;line-height:1.45;margin:0}
.flowbox{min-width:0}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.chip{font-family:var(--mono);font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.r-analyst{color:var(--analyst)} .r-spec{color:var(--spec)} .r-dev{color:var(--dev)} .r-qa{color:var(--qa)} .r-human{color:var(--human)} .r-coord{color:var(--coord)}
.lanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.lane{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
.lane b{display:block;font-family:var(--mono);font-size:.8rem;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.lane p{margin:4px 0 0;font-size:.92rem}
.always{margin-top:10px;font-size:.92rem;color:var(--muted)}
ul.rules{margin:0;padding-left:20px} ul.rules li{margin:4px 0}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:12px 0;min-width:0}
.stage.approved{border-color:var(--ok)} .stage.change{border-color:var(--warn)}
.head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 12px}
.num{font-family:var(--mono);font-weight:600;color:var(--accent);min-width:2.2em}
.head h3{margin:0;font-size:1.05rem;flex:1 1 220px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px}
.tag{font-family:var(--mono);font-size:.72rem;color:var(--muted);border:1px dashed var(--line);border-radius:999px;padding:2px 8px}
.stage ol{margin:0;padding-left:22px} .stage ol li{margin:3px 0}
.kv{display:grid;grid-template-columns:7.5em 1fr;gap:4px 12px;margin-top:10px;font-size:.92rem}
.kv dt{font-family:var(--mono);font-size:.75rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.kv dd{margin:0;min-width:0}
.src{font-size:.8rem;color:var(--muted);margin-top:8px}
.act{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
button{font:inherit;font-size:.88rem;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;padding:5px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.on-ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
button.on-warn{background:var(--warn);border-color:var(--warn);color:var(--surface)}
textarea{font:inherit;font-size:.9rem;width:100%;box-sizing:border-box;min-height:56px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);padding:8px}
.bar{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);margin-top:28px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.count{font-family:var(--mono);font-size:.82rem;font-variant-numeric:tabular-nums;color:var(--muted)}
.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
#copied{font-size:.85rem;color:var(--ok)}
@media (prefers-reduced-motion:no-preference){.stage{transition:border-color .15s}}
.rec{font-family:var(--mono);font-size:.72rem;padding:2px 8px;border-radius:999px;border:1px solid currentColor}

.rule{font-size:1rem;margin:6px 0 0}
.extra{white-space:pre-wrap;font-family:var(--mono);font-size:.8rem;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;overflow-x:auto;margin-top:8px}
details.drop{margin:10px 0 24px;background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:10px 14px}
details.drop summary{cursor:pointer;font-weight:700}
details.drop div{white-space:pre-wrap;font-size:.88rem;margin-top:8px}
button.on-bad{background:var(--human);border-color:var(--human);color:var(--surface)}
.stage.rejected{border-color:var(--human)}
nav.toc{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 0}
nav.toc a{font-family:var(--mono);font-size:.78rem;color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px}
</style>

const D=[{"name": "1 \u00b7 spec-review.md \u2014 is a REQ (or story) buildable, complete, consistent", "items": [{"id": "SR1", "title": "All findings in one pass", "rule": "Report every finding the rubric produces in one review round; a finding first raised in round N+1 on unchanged text is a reviewer miss.", "source": "mattpocock `R/mattpocock-skills/skills/productivity/grilling/SKILL.md:8` (\"Ask the whole frontier in one round\"); ours: fleet self-reports `00-fleet-self-reports.md` spec-reviewer row \u2014 #576 took 3 rounds, analyst row #576 4 gaps one per round.", "kind": "review check (output contract).", "recommend": "adopt \u2014 the most-repeated fleet failure on this axis; cheap to state.", "extra": "", "drop": ""}, {"id": "SR2", "title": "Every existing-behaviour claim is verified at HEAD", "rule": "Each sentence in a REQ asserting how the system behaves today must cite `file:line` on `origin/master`; the reviewer opens each cite; an unverified claim is a finding.", "source": "humanlayer `R/humanlayer-humanlayer/.claude/commands/create_plan.md:68-72` (\"Cross-reference the ticket requirements with actual code\"); `research_codebase.md:16` (\"ONLY describe what exists\"); ours: fleet analyst row #585 (build-cache claim unverified), spec-reviewer row \"unverified existing-behaviour claims\". Generalises `SR/:215-220` C-09, which today fires only on \"no impact\" claims.", "kind": "review check (new criterion C-11, BLOCKER when the claim is false, GAP when uncited).", "recommend": "adopt \u2014 C-09 already proves the pattern; this widens it to every factual claim.", "extra": "", "drop": ""}, {"id": "SR3", "title": "Cites are re-checked against current master", "rule": "A `file:NN` cite in a REQ or issue body that no longer points at the named symbol is a finding; the check is mechanical, not reviewer memory.", "source": "ours #61 row 15 (#636 \"`file:NN` cites in stories unchecked\"); fleet spec-reviewer row \"line drift vs HEAD\"; `W/scripts/check-doc-dri ecommend": "adopt \u2014 the persona split deletes its only home.", "extra": "", "drop": ""}, {"id": "SR7", "title": "One change-class gate, stated positively", "rule": "Decide the review tier from what the diff **is** (code \u00b7 operability \u00b7 authority doc \u00b7 process/docs); an unplaceable path is code.", "source": "`AR/:49-60` rule 4 (positive class table, \"When you cannot place a path, it is code\"); replaces `SR/:52-66` rule 5, which is stated as what the diff is not.", "kind": "reference rule.", "recommend": "adopt \u2014 two tier gates with different wording drift; AR's form is the safer one.", "extra": "", "drop": ""}, {"id": "SR8", "title": "ND-7: architecture-review A\u2013E at stage 5", "rule": "", "source": "`14-disposition-table.md:117,258` (ND-7); overlap pairs checked this run:\n```\nSR A-02 :123 ~ AR A-06 :156  shared contract     SR T-05 :289 ~ AR C-03 :245  flag off path\nSR A-03 :130 ~ AR A-07 :163  ADR contradicted    SR C-03 :173 ~ AR D-07 :319  roles / RBAC\nSR T-01 :261 ~ AR A-01 :121  module edge         SR C-05 :187 ~ AR D-01 :277  failure path\nSR T-02 :268 ~ AR A-03 :135  Spring AI confined  SR C-06 :194 ~ AR D-08 :326  logging\n```", "kind": "reference rule (structure).", "recommend": "**A, merge** \u2014 one reader at stage 5 (G3/G2), 8 duplicate pairs vanish, ~9.1k words \u2192 one file; B keeps two rubrics that already disagree on the tier gate (SR7).", "extra": "Rule (option A, recommended): Merge AR groups A\u2013E into `spec-review.md` as one stage-5 rubric, deduplicating the eight overlapping criterion pairs; F-01 moves to the review Spec verdict.\nRule (option B): Keep AR A\u2013E as a separate `planning/references/design-review.md`, both read at stage 5 by the spec-reviewer role.\nSource: `14-disposition-table.md:117,258` (ND-7); overlap pairs checked this run:\n```\nSR A-02 :123 ~ AR A-06 :156  shared contract     SR T-05 :289 ~ AR C-03 :245  flag off path\nSR A-03 :130 ~ AR A-07 :163  ADR contradicted    SR C-03 :173 ~ AR D-07 :319  roles / RBAC\nSR T-01 :261 ~ AR A-01 :121  module edge         SR C-05 :187 ~ AR D-01 :277  failure path\nSR T-02 :268 ~ AR A-03 :135  Spring AI confined  SR C-06 :194 ~ AR D-08 :326  logging\n```\nKind: reference rule (structure).\nRecommend: **A, merge** \u2014 one reader at stage 5 (G3/G2), 8 duplicate pairs vanish, ~9.1k words \u2192 one file; B keeps two rubrics that already disagree on the tier gate (SR7).\n\n**DROP from today's spec-review**\n- `SR/:60-66` and `AR/:72-78` \u2014 the #540 token-cost narrative: history, belongs in the commit/ADR, not the rubric.\n- `SR/:83` \u2014 authority row `.agents/skills/code/SKILL.md/` (trailing slash, a skill is not an authority for a REQ); and `:82` \"CLAUDE.md \u00a7Critical Architecture Rules\" \u2014 section names no longer exist after the AGENTS.md flip.\n- `SR/:305-315` \"Does not own\" rows naming `spec-design-reviewer` / `architecture-review` \u2014 both agents are deleted (disposition :118-119).\n- `MEMORY.md` as a separate file \u2014 merge its one entry into C-09's EDGE (disposition :116).\n\n---", "drop": "**DROP from today's spec-review**\n- `SR/:60-66` and `AR/:72-78` \u2014 the #540 token-cost narrative: history, belongs in the commit/ADR, not the rubric.\n- `SR/:83` \u2014 authority row `.agents/skills/code/SKILL.md/` (trailing slash, a skill is not an authority for a REQ); and `:82` \"CLAUDE.md \u00a7Critical Architecture Rules\" \u2014 section names no longer exist after the AGENTS.md flip.\n- `SR/:305-315` \"Does not own\" rows naming `spec-design-reviewer` / `architecture-review` \u2014 both agents are deleted (disposition :118-119).\n- `MEMORY.md` as a separate file \u2014 merge its one entry into C-09's EDGE (disposition :116).\n\n---"}]}, {"name": "2 \u00b7 acceptance-criteria.md \u2014 gaps only", "items": [{"id": "AC7", "title": "Scenarios cover state that existed before the change", "rule": "When a change alters stored data or a default, at least one scenario's Given is state created before the change (old row, unseeded key).", "source": "ours `14-disposition-table.md:114` (P1:9 \"AC-6 proved only on new rows\"); fleet qa row \"ACs asserting defaults not behaviour\"; `SR/MEMORY.md:9-13` (un-defaulted reader).", "kind": "reference rule + review check.", "recommend": "adopt \u2014 the one AC gap with two independent fleet incidents.", "extra": "", "drop": ""}, {"id": "AC8", "title": "Prune columns that never vary", "rule": "An Examples column whose value is identical on every row moves to Background or the Given; it is not a placeholder.", "source": "today `W/.agents/skills/planning/references/acceptance-criteria.md:56-72` (rule 3); not covered by GA4 (which fixes header\u2194placeholder match only).", "kind": "reference rule.", "recommend": "adopt \u2014 the only one of today's four rules GA1\u2013GA6 do not already carry.", "extra": "", "drop": ""}, {"id": "AC9", "title": "Domain words only", "rule": "Scenario text uses terms from the glossary and sibling REQs; a new noun is declared in the REQ before a scenario uses it.", "source": "mattpocock `R/mattpocock-skills/skills/engineering/to-spec/SKILL.md:13` (\"Use the project's domain glossary vocabulary\"); `SR/:137-142` A-04.", "kind": "reference rule (author side of A-04).", "recommend": "adopt \u2014 GT1 makes the title the test name, so a bad word lands in code.", "extra": "", "drop": ""}, {"id": "AC10", "title": "Changing an approved AC re-opens approval", "rule": "Editing the text of an AC after `/approved` (not only its id) is a spec change: record it on the MR and get a fresh `/approved`.", "source": "ours `W/.agents/skills/crq/SKILL.md:250` (approval covers the design as it stood); extends GA2 (ids only).", "kind": "reference rule.", "recommend": "adopt \u2014 GA2 freezes the id, nothing freezes the meaning.", "extra": "", "drop": ""}, {"id": "AC11", "title": "Manual-only checks are labelled", "rule": "A criterion no IT or smoke can assert is marked `# manual` with the exact human step; it never sits unmarked among automated scenarios.", "source": "humanlayer `create_plan.md:345-359` (automated vs manual verification); AT1 (`19-approved-rules.md:31`).", "kind": "reference rule.", "recommend": "hold \u2014 AT1 says every AC is proven by IT or smoke; operator should decide whether manual ACs are allowed at all.", "extra": "", "drop": "**DROP from today's acceptance-criteria.md**\n- `:13-18` Gherkin-runtime history paragraph \u2014 superseded by GA1 (fenced gherkin, no runtime).\n- `:26-54`, `:74-88` rules 1, 2, 4 \u2014 restated by GA5 (one checkable Then), GA4 (Outline + Background).\n- `:13`, `:95` pointers to `mattpocock-skills:to-spec` \"calls for it\" \u2014 to-spec never names this file (disposition :114, R2:60).\n- frontmatter `name: acceptance-criteria-writing` (`:2-3`) \u2014 it is a reference now, not a skill.\n\n---"}]}, {"name": "3 \u00b7 program-design.md \u2014 NEW, stage-5 design content", "items": [{"id": "PD1", "title": "Call-tree diff for control-flow changes", "rule": "A design that adds or reroutes a call path shows the call tree as a fenced `diff`, `+` for new calls, `-` for removed.", "source": "ACE `wsff.md:491` (\"Call-stack trees, for any orchestration or control-flow change\"); `:536` (cheaper than deciding in code review).", "kind": "reference rule + review check (stage 5).", "recommend": "adopt.", "extra": "", "drop": ""}, {"id": "PD2", "title": "File-tree diff with test files", "rule": "The design shows a file-tree diff marking every new, modified and deleted file, test files included, each with a one-line purpose.", "source": "ACE `wsff.md:507-515` (`# NEW` / `# MODIFIED` annotations); humanlayer `create_plan.md:215-219` (File / Changes per component).", "kind": "reference rule + review check.", "recommend": "adopt \u2014 also the input F-01 grades against.", "extra": "", "drop": ""}, {"id": "PD3", "title": "Types and signatures, bodies left out", "rule": "New records, sealed interfaces, ports and public method signatures are written in Java with no bodies; usage by the caller is written first.", "source": "ACE `wsff.md:517` (\"too internal for an architecture doc but that an agent might still get wrong\"); pstack `R/cursor-plugins/pstack/skills/architect/SKILL.md:9,83` (\"caller's usage is written first\").", "kind": "reference rule.", "recommend": "adopt.", "extra": "", "drop": ""}, {"id": "PD4", "title": "Thin end-to-end slices, not stack order", "rule": "The build order is slices that each run end-to-end and can be poked (curl, UI, IT); never migration \u2192 service \u2192 API \u2192 UI as separate steps.", "source": "ACE `wsff.md:542-566` (\"Models love what I call 'horizontal plans'\"); mattpocock `to-tickets/SKILL.md:31-34`; addy `planning-and-task-breakdown/SKILL.md:57-77`.", "kind": "reference rule + review check.", "recommend": "adopt \u2014 direct fix for review-time discovery (!230).", "extra": "", "drop": ""}, {"id": "PD5", "title": "Each slice names its check as a make command", "rule": "Every slice states the `make` target (and `TEST=` filter) that proves it, plus any manual step.", "source": "humanlayer `create_plan.md:225-232,325` (\"automated steps should use `make` whenever possible\"); ours AGENTS.md make-front-door block.", "kind": "reference rule.", "recommend": "adopt.", "extra": "", "drop": ""}, {"id": "PD6", "title": "Program design lives beside the REQ, not in it", "rule": "Paths, signatures and trees go in the draft MR's design section (or `docs/design/`), never in the REQ, which stays behaviour-only.", "source": "mattpocock `to-spec/SKILL.md:55` (\"Do NOT include specific file paths or code snippets\"); ours SR3 (cites rot).", "kind": "reference rule.", "recommend": "adopt \u2014 keeps the REQ stable after merge while the design is disposable.", "extra": "", "drop": ""}, {"id": "PD7", "title": "Deviation from the sketch is surfaced", "rule": "During stage 6, a needed change to an approved type, signature or file placement is posted on the MR before ss, module, table or endpoint name that `grep` finds on master.", "source": "today `diagrams.md:31-32`.", "kind": "mechanical \u2192 add Mermaid node labels to `check-doc-drift.sh` \u00a74 named symbols (`:147`).", "recommend": "adopt as reference rule now; mechanical check hold until \u00a74 scope is widened (SR3 same change).", "extra": "", "drop": ""}, {"id": "DG4", "title": "One diagram, one question", "rule": "Each diagram answers one question from the type table; a second question gets a second diagram.", "source": "today `diagrams.md:16-25,29-30`.", "kind": "reference rule.", "recommend": "adopt (keep).", "extra": "", "drop": ""}, {"id": "DG5", "title": "A diagram that needs a paragraph is redrawn", "rule": "If understanding the diagram requires prose beyond a one-line caption, redraw it smaller rather than adding text.", "source": "mattpocock `R/mattpocock-skills/skills/engineering/improve-codebase-architecture/HTML-REPORT.md:55` (\"If the diagram needs a paragraph to be understood, redraw the diagram\").", "kind": "reference rule.", "recommend": "adopt \u2014 matches the operator's show-me style.", "extra": "", "drop": ""}, {"id": "DG6", "title": "A diagram lives in the doc it explains", "rule": "Put the diagram in the ADR, REQ or design doc it illustrates; no standalone diagrams file.", "source": "today `diagrams.md:33-34`.", "kind": "reference rule.", "recommend": "adopt (keep).", "extra": "", "drop": "**DROP from today's diagrams.md**\n- `:5-8` GitLab/Artifact rendering facts and the PlantUML aside \u2014 environment facts (a cache, per writing-for-agents `SKILL.md:79`).\n- `:10-12` pointer to `show-me` for chat sketches \u2014 show-me moves to the humanlayer plugin (disposition :136); DG1 replaces it.\n\n---"}]}, {"name": "5 \u00b7 writing-docs.md \u2014 NEW (ND-8)", "items": [{"id": "WD1", "title": "No trust stamps", "rule": "Do not write `[confirmed: \u2026]` or any in-text verification marker; a claim that needs proof gets a cite the drift check can run.", "source": "`W/AGENTS.md:432-437`; ours #335 (65 stamps, 3 sampled all defective), REQ-069.", "kind": "MUST (L2) \u2014 short enough to stay always-on.", "recommend": "adopt.", "extra": "", "drop": ""}, {"id": "WD2", "title": "Name the thing, not the tally", "rule": "Do not write counts that change as a side effect of unrelated work; stable deliberate facts (Java 25, port 8080, a TTL) are fine.", "source": "`W/AGENTS.md:439-441`; `W/scripts/check-doc-drift.sh:3-7` (PUBLIC_PATHS 17\u219220, 57\u219258 controllers).", "kind": "mechanical \u2192 `check-doc-drift.sh` \u00a71 + `--tallies`; plus reference rule.", "recommend": "adopt \u2014 and wire `make doc-drift` into `make lint` (today it runs only on its own target, `W/Makefile:359-360`, not in `verify` `:379`).", "extra": "", "drop": ""}, {"id": "WD3", "title": "Known-stale claims go in Doc drift", "rule": "A claim known to disagree with the code is recorded in `ARCHITECTURE.md` \u00a79 Doc drift, never fixed with a bracket or left silent.", "source": "`W/AGENTS.md:444`; `W/docs/architecture/ARCHITECTURE.md:609`.", "kind": "reference rule.", "recommend": "adopt.", "extra": "", "drop": ""}, {"id": "WD4", "title": "Uncomfortable operational truths go in", "rule": "Write the operational fact even when it is unflattering; a reassuring false line is the worst line a doc can carry.", "source": "`W/AGENTS.md:442-443` (only-the-api-runs-migrations line).", "kind": "reference rule.", "recommend": "adopt.", "extra": "", "drop": ""}, {"id": "WD5", "title": "REQ only for new behaviour", "rule": "A bug corrects the REQ it violates, in place; a chore with no owning REQ carries problem, scope and ACs in the issue; a new REQ is for behaviour the product lacks.", "source": "`W/AGENTS.md:446-449`.", "kind": "reference rule (crq stage 3 points here).", "recommend": "adopt.", "extra": "", "drop": ""}, {"id": "WD6", "title": "REQ number = issue number; ADR number cross-branch", "rule": "A new REQ is `REQ-<issue>-slug`; a new ADR takes the next number free on master and every in-flight branch, per `docs/adr/README.md`.", "source": "`W/AGENTS.md:449-453`; `W/docs/adr/README.md:26,59`; evidence: two `REQ-073-*` files exist on this branch (`docs/spec/REQ-073-jacoco-integration-coverage.md`, `REQ-073-tool-rename-name-uniqueness.md`). Rejects mattpocock `domain-modeling/ADR-FORMAT.md:27` (\"Scan `docs/adr/` for the highest existing number\") \u2014 that is the collision we hit.", "kind": "mechanical \u2192 extend `check-migration-version.sh`-style cross-branch hook to `docs/adr/`; REQ side is a reference rule.", "recommend": "adopt \u2014 and note the vendored ADR-FORMAT must carry our override (disposition :125).", "extra": "", "drop": ""}, {"id": "WD7", "title": "One owner per fact", "rule": "Each fact lives in one file; other docs link to it rather than restate it, and generated docs are never hand-edited.", "source": "mattpocock `writing-for-agents/SKILL.md:78` (single source of truth); kunchenguid-firstmate `AGENTS.md:55` (\"single owner of the top-level ... layout\"); openclaw `docs/AGENTS.md:38` (\"Generated docs, never hand-edit\").", "kind": "reference rule.", "recommend": "adopt \u2014 it is the principle the whole one-rulebook move rests on.", "extra": "", "drop": ""}, {"id": "WD8", "title": "Do not restate what the environment answers", "rule": "Do not copy into docs what one command or file answers (make targets, versions in build files); write the why and the gotcha instead.", "source": "mattpocock `writing-for-agents/SKILL.md:79` (\"a document that restates it is a cache\").", "kind": "reference rule.", "recommend": "hold \u2014 overlaps WD2/WD7; adopt only if the operator wants the \"cache\" word as a leading term.", "extra": "", "drop": "**DROP from today's AGENTS.md block** (once writing-docs.md exists)\n- `W/AGENTS.md:430-454` whole block \u2192 this file plus one L2 line for WD1; REQ-numbering table stays in crq stage 3 (disposition :127).\n- `:451` \"`REQ-001`\u2013`REQ-073` keep their sequential numbers\" \u2014 history; keep only the rule."}]}];
const KEY="planning-rules-v1";
let st={};try{st=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){st={}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const esc=s=>(s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])).replace(/`([^`]+)`/g,"<code>$1</code>");
const recOf=r=>/^\*{0,2}(adopt|hold|reject)/i.exec((r||"").replace(/^\*+/,""));
const all=[];const G=document.getElementById("groups"),T=document.getElementById("toc");
D.forEach((g,gi)=>{
  const id="g"+gi;T.insertAdjacentHTML("beforeend",`<a href="#${id}">${esc(g.name.split(" — ")[0].replace(/^\d+ · /,""))}</a>`);
  G.insertAdjacentHTML("beforeend",`<h2 id="${id}">${esc(g.name)}</h2>`);
  let drop="";
  g.items.forEach(x=>{
    all.push(x);if(x.drop)drop=x.drop;
    const rm=recOf(x.recommend),rk=rm?rm[1].toLowerCase():"";
    const el=document.createElement("section");el.className="stage";
    el.innerHTML=`<div class="head"><span class="num">${x.id}</span><h3>${esc(x.title)}</h3>${rk?`<span class="rec ${rk}">${rk}</span>`:""}</div>
    ${x.rule?`<p class="rule">${esc(x.rule)}</p>`:""}${x.extra?`<div class="extra">${esc(x.extra.split("**DROP")[0].split("**Drop")[0])}</div>`:""}
    <dl class="kv">${x.kind?`<dt>Kind</dt><dd>${esc(x.kind)}</dd>`:""}${x.source?`<dt>Source</dt><dd>${esc(x.source)}</dd>`:""}${x.recommend?`<dt>Why</dt><dd>${esc(x.recommend.replace(/\n\*\*DROP[\s\S]*|\n\*\*Drop[\s\S]*/,""))}</dd>`:""}</dl>
    <div class="act"><button data-v="ok">Approve</button><button data-v="no">Reject</button><button data-v="change">Change</button></div>
    <textarea placeholder="What should change?" hidden></textarea>`;
    G.appendChild(el);x.el=el;
    const ta=el.querySelector("textarea");ta.id="n_"+x.id;ta.value=(st[x.id]||{}).note||"";
    const b=v=>el.querySelector(`[data-v="${v}"]`);
    x.paint=()=>{const v=(st[x.id]||{}).v;el.classList.toggle("approved",v==="ok");el.classList.toggle("rejected",v==="no");el.classList.toggle("change",v==="change");
      b("ok").classList.toggle("on-ok",v==="ok");b("no").classList.toggle("on-bad",v==="no");b("change").classList.toggle("on-warn",v==="change");ta.hidden=v!=="change";count()};
    b("ok").onclick=()=>{st[x.id]={v:"ok"};save();x.paint()};
    b("no").onclick=()=>{st[x.id]={v:"no"};save();x.paint()};
    b("change").onclick=()=>{st[x.id]={v:"change",note:ta.value};save();x.paint();ta.focus()};
    ta.oninput=()=>{st[x.id]={v:"change",note:ta.value};save()};
  });
  if(drop)G.insertAdjacentHTML("beforeend",`<details class="drop"><summary>What leaves today's file</summary><div>${esc(drop.replace(/^\*\*[^*]+\*\*\s*/,""))}</div></details>`);
});
function count(){document.getElementById("count").textContent=`${all.filter(x=>(st[x.id]||{}).v).length} of ${all.length} decided`}
all.forEach(x=>x.paint());
document.getElementById("bulk").onclick=()=>{all.forEach(x=>{const m=recOf(x.recommend);if(m&&m[1].toLowerCase()==="adopt"&&!(st[x.id]||{}).v){st[x.id]={v:"ok"}}});save();all.forEach(x=>x.paint())};
document.getElementById("copy").onclick=()=>{
  const L=["Planning rules (#35):"];all.forEach(x=>{const d=st[x.id]||{};L.push(`${x.id}: `+(d.v==="ok"?"approve":d.v==="no"?"reject":d.v==="change"?"change — "+(d.note||"(no note)"):"undecided"))});
  const t=L.join("\n"),fb=document.getElementById("fallback"),cp=document.getElementById("copied");
  const ok=()=>{cp.hidden=false;setTimeout(()=>cp.hidden=true,1800)};
  try{navigator.clipboard.writeText(t).then(ok,()=>{fb.hidden=false;fb.value=t;fb.select()})}catch(e){fb.hidden=false;fb.value=t;fb.select()}};
